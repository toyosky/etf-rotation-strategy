  - stage: 6
    status: frozen
    decision: transfer_rank_persistence_regime_shift_pass
    run_id: 34847008430
    design: research/optimal_universe_reverse_engineering/OURE_STAGE6_TRANSFER_REGIME_DESIGN_20260914.md
    findings: research/optimal_universe_reverse_engineering/OURE_STAGE6_FINDINGS_20260914.md
    notes: "Median past6M->future Universe-rank Spearman flips -0.209 (2022-24) to +0.409 (2025-26); robust rank -0.087 to +0.353. Later era has broader eligibility, larger Top1-Top2 gap, faster switching and shorter tenure."

  - stage: 6B
    status: frozen_explanatory_layer1
    decision: fix15_2022_2024_good_sets_are_persistence_controlled_competition
    run_id: 34848320084
    design: research/optimal_universe_reverse_engineering/OURE_STAGE6B_2022_2024_GOOD_UNIVERSE_TRAITS_DESIGN_20260914.md
    findings: research/optimal_universe_reverse_engineering/OURE_STAGE6B_FINDINGS_20260914.md
    notes: "Exact Fix15 lattice only. 2022-24 within-K good sets strongly have longer Top1 tenure, lower switch rate and fewer short leaders; later full-market Stage6C showed that this does not imply a general small-K law."

  - stage: 6C
    status: frozen
    decision: fullmarket_2022_2024_large_k_frontier_reappears
    run_id: 34849477779
    design: research/optimal_universe_reverse_engineering/OURE_STAGE6C_FULLMARKET_2022_2024_K_FRONTIER_DESIGN_20260914.md
    findings: research/optimal_universe_reverse_engineering/OURE_STAGE6C_FINDINGS_20260914.md
    notes: "Full-market 2022-start-eligible pool (265 risk ETFs), no Fix15 identity rule. Strong heuristic frontier rejects a general small-K law: broad K20-K30 high plateau with searched K30 about +899%. K30 elite vs random K30 has lower switch rate, longer tenure, fewer short runs and much higher productive-switch/counterfactual gain."

  - stage: 6D
    status: frozen_failed_primary_gate
    decision: member_marginal_value_not_lowdim_identifiable
    run_id: 34852348851
    design: research/optimal_universe_reverse_engineering/OURE_STAGE6D_FIXED_K30_MEMBER_MARGINAL_DESIGN_20260914.md
    findings: research/optimal_universe_reverse_engineering/OURE_STAGE6D_FINDINGS_20260914.md
    notes: "With K fixed at 30, two eras choose sharply different members (champion Jaccard 0.0909), but preregistered X<=t member-marginal gate fails. Prior new-coverage is saturated/constant zero at K29; replacement-gain mean is near zero/inconsistent; productive-challenge share is negatively associated with future marginal value. The strongest stable secondary signal is raw prior challenge share: median context Spearman -0.332 in 2022-24 and -0.404 in 2025-26, so frequent historical challengers are a robust conditional-admission warning. This is only conditional on a strong hindsight-derived K29 core and is not a from-scratch K30 constructor."

next_gate:
  direction: "separate core-set formation from 30th-member admission; preserve Stage6D challenge-intensity veto as a frozen conditional hypothesis while continuing strict X<=t state/core construction work"
  constraints: "Do not tune Stage6D weights/windows or add high-capacity member predictors. No small-K prior and no Fix15 identity. If challenge-share is used next, preregister it as an admission/redundancy veto, not a complete ranking model. Core-set formation must be designed separately using only X<=t information, with frozen downstream OLS."
