  - stage: 6K
    status: frozen_failed
    decision: adjacent_mapping_transfer_not_supported
    run_id: 34865276309
    design: research/optimal_universe_reverse_engineering/OURE_STAGE6K_ADJACENT_126_TRANSFER_DESIGN_20260914.md
    findings: research/optimal_universe_reverse_engineering/OURE_STAGE6K_ADJACENT_126_TRANSFER_FINDINGS_20260914.md
    notes: "Strict non-overlapping 126->126 transfer. Previous-block RF: median IC +0.1092, 7/8 positive, median top-decile lift +0.00487, but median predicted-Top50 actual percentile only 0.5300 versus frozen >0.60 gate. Simple current past126 rank has similar median IC +0.1187 and Top50 0.5302; expanding-history RF is negative. Broad rank persistence exists, but top-tail mapping is not deployable and RF has no robust incremental edge over the simple baseline."

  - stage: 6L
    status: frozen_partial_pass_model_fail
    decision: stable_internal_structure_but_second_layer_not_oos_supported
    run_id: 34869360796
    design: research/optimal_universe_reverse_engineering/OURE_STAGE6L_RF_FALSE_POSITIVE_STRUCTURE_DESIGN_20260914.md
    findings: research/optimal_universe_reverse_engineering/OURE_STAGE6L_RF_FALSE_POSITIVE_STRUCTURE_FINDINGS_20260914.md
    notes: "Matched audit inside previous-block-RF top20% passes structural gate: 12/47 new internal features across four families are stable. True RF-high winners have broadly stronger member singleton harvestability and eligibility participation, somewhat more distributed leader participation, and higher p90 pair return correlation. Leave-one-out robustness does not survive the full gate. Conditional chronological Ridge residual layer fails all four OOS gates: median residual IC -0.0611, only 1/5 positive, median Top50 percentile 0.4627, median Top50 gain vs RF -0.0659. Internal good/bad structure exists ex post, but the frozen low-complexity second layer cannot identify it prospectively."

  - stage: 6M
    status: frozen_diagnostic
    decision: sample_size_not_primary_explanation
    design: research/optimal_universe_reverse_engineering/OURE_STAGE6M_SECOND_LAYER_SAMPLE_SIZE_DIAGNOSTIC_DESIGN_20260915.md
    findings: research/optimal_universe_reverse_engineering/OURE_STAGE6M_SECOND_LAYER_SAMPLE_SIZE_DIAGNOSTIC_FINDINGS_20260915.md
    notes: "Holding common targets B06..B09 fixed, increasing historical Ridge training blocks from N=1 to N=4 does not produce a monotone learning curve. On the 12 stable traits median residual IC is -0.024,+0.107,-0.007,-0.076; only one of four preregistered sample-size gates passes. This weakens pure sample-scarcity as the primary explanation and is more consistent with mapping drift/stale-history contamination, without proving more genuinely new future blocks would not help."

  - stage: 6N
    status: frozen_failed_primary_and_secondary
    decision: xgboost_second_layer_not_supported
    run_id: 34911172587
    design: research/optimal_universe_reverse_engineering/OURE_STAGE6N_XGBOOST_SECOND_LAYER_DESIGN_20260915.md
    findings: research/optimal_universe_reverse_engineering/OURE_STAGE6N_XGBOOST_SECOND_LAYER_FINDINGS_20260915.md
    notes: "Frozen nonlinear test on B05..B09. XGBoost residual improves residual median IC versus Ridge (-0.0905 -> +0.0553) but fails all secondary gates; pairwise ranker has strong isolated B07 (+0.375 IC, Top50 0.655) yet aggregate median IC -0.0344, only 2/5 positive, Top50 0.4878 and negative top-decile lift, so all primary gates fail. Model misspecification contributes somewhat, but added nonlinear capacity alone does not solve chronological transfer. The preregistered simple past126 set-log-growth baseline is strongest inside RF-high: median IC +0.1459, 4/5 positive, Top50 0.5588, top-decile lift +0.0524; treat this as a new cascade hypothesis, not a promoted strategy."


  - stage: 6O
    status: frozen_partial_pass_predictive_fail
    decision: member_traits_exist_but_admission_not_oos_supported
    run_id: 34914650531
    design: research/optimal_universe_reverse_engineering/OURE_STAGE6O_RF_HIGH_WINNER_MEMBER_AUDIT_DESIGN_20260915.md
    findings: research/optimal_universe_reverse_engineering/OURE_STAGE6O_RF_HIGH_WINNER_MEMBER_AUDIT_FINDINGS_20260915.md
    notes: "Inside previous-block-RF top20% K30s, member-level conditional future value has repeatable past-only structure: 6/21 traits across A/B/C/D pass the frozen stability gate. Future-useful members are more often eligible, less ubiquitous in RF-high, embedded in weaker trailing126 set contexts, somewhat further below recent highs, and not necessarily strong singleton past winners. However the strict chronological member RF fails all five predictive gates: median IC +0.0713, 3/5 positive, top10 actual percentile 0.4284, median top10 conditional-marginal lift -0.0230. Member mechanism exists, but prospective admission is not established."

next_gate:
  direction: "Stage6O is frozen. The member-level unit of analysis is more informative: future-useful members inside RF-high sets show a repeated qualified-but-underrepresented / less-historically-exhausted challenger pattern, but the frozen chronological member RF does not identify the next top admissions."
  constraints: "Do not tune Stage6O RF-high cutoff, minimum appearance count, winner/loser cutoffs, member features, RF hyperparameters, or top10 rule on this history. A continuation must be a genuinely new admission hypothesis or new forward data, not post-hoc rescue."
