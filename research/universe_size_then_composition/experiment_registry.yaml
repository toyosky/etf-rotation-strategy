research_line: universe_size_then_composition
started_at: 2026-09-14
status: active
previous_lineage:
  path: research/marginal_universe_value/
  status: frozen_historical_evidence
  rule: do_not_continue_old_stage_numbers

frozen_downstream_rule:
  name: original_ols_rotation
  note: downstream OLS logic must remain unchanged during size/composition mechanism research

stages:
  - id: new_stage_1
    name: oracle_universe_size_monte_carlo
    status: frozen
    decision: branch_to_stage2_mechanism
    findings_doc: research/universe_size_then_composition/STAGE1_FINDINGS_20260914.md
    objective: Determine whether Universe size K has a general effect on one-month Frozen OLS value and whether a stable favorable K range exists.
    primary_design:
      parent_pool: monthly_point_in_time_representative_etfs
      representative_rule: prior_day_eligibility_plus_120d_corr_liquidity_first_dedup
      primary_corr_threshold: 0.95
      predeclared_sensitivity_corr_threshold: 0.90
      k_range: 3..30_subject_to_monthly_availability
      sampling: independent_same_k_random_universes
      nested_deletion_paths: secondary_random_15_to_3
      cash_signal_forced: 511220
      fixed_rng_seed: 20260914
      evaluate_by_month: true
      oracle_usage: mechanism_diagnosis_only
    first_batch_20260914:
      source_run_id: 34772895471
      status: completed_success
      samples_per_k_per_month: 180
      nested_15_to_3_paths_per_month: 36
      months: 68
      sampled_universes: 374544
      era_2021_24_k30_minus_k3_mean: -0.013862
      era_2021_24_month_bootstrap_95pct: [-0.02309, -0.00442]
      era_2025_26_k30_minus_k3_mean: 0.011655
      era_2025_26_month_bootstrap_95pct: [-0.01559, 0.03958]
    robustness_batch_20260914:
      source_run_id: 34775534691
      status: completed_success
      alt_seed_2021_24_k30_minus_k3: -0.013501
      alt_seed_2025_26_k30_minus_k3: 0.012836
      corr090_2021_24_k30_minus_k3: -0.014080
      corr090_2025_26_k30_minus_k3: 0.013632
      base_alt_seed_month_k_return_mean_corr: 0.99888
      base_corr090_month_k_return_mean_corr: 0.99721
    frozen_conclusion: >-
      Universe size effect is regime-dependent. K up raises winner coverage and competition/switching while observed Top1 tenure falls. The economic payoff reverses across eras. No universal exact K or global K range is supported.

  - id: new_stage_2
    name: size_mechanism_remaining_trend_life
    status: frozen
    decision: reject_strong_lifetime_return_mechanism
    dependency: new_stage_1
    design_doc: research/universe_size_then_composition/STAGE2_TREND_EPISODE_REMAINING_LIFE_DESIGN_20260914.md
    findings_doc: research/universe_size_then_composition/STAGE2_FINDINGS_20260914.md
    script: research/universe_size_then_composition/stage2_remaining_trend_life.py
    source_run_id: 34778676590
    source_artifact: universe-size-stage2-34778676590
    objective: Test whether larger K delays first-Top1 admission within each ETF intrinsic trend episode, reducing true remaining trend life/return, while small K incurs opposing winner-coverage cost.
    key_definition: Remaining trend life is the ETF own residual intrinsic trend-episode life after first Top1 admission, not observed Top1 tenure.
    frozen_episode_state: stage1_pool_score_nonnull
    effective_inference_unit: month
    key_evidence:
      era_2021_24_k30_minus_k3_trend_age_ratio: 0.144951
      era_2025_26_k30_minus_k3_trend_age_ratio: 0.124863
      era_2021_24_k30_minus_k3_remaining_days: -4.734375
      era_2025_26_k30_minus_k3_remaining_days: -3.9875
      era_2021_24_k30_minus_k3_remaining_return: 0.002608
      era_2025_26_k30_minus_k3_remaining_return: 0.017445
      era_2021_24_age_ratio_remaining_days_mean_month_spearman: -0.5726
      era_2025_26_age_ratio_remaining_days_mean_month_spearman: -0.7461
      era_2021_24_age_ratio_remaining_return_mean_month_spearman: 0.0199
      era_2025_26_age_ratio_remaining_return_mean_month_spearman: 0.1162
    frozen_conclusion: >-
      Larger K robustly shifts first admission later in normalized intrinsic trend age and reduces remaining active days, but does not create a stable remaining-return penalty. The strong chain K up -> later -> shorter -> lower return is rejected without redefining lifetime. Proceed using weaker coverage-versus-competition conditional state.

  - id: new_stage_3
    name: conditional_size_direction_identifiability
    status: registered_running
    dependency: new_stage_2
    design_doc: research/universe_size_then_composition/STAGE3_CONDITIONAL_SIZE_DIRECTION_DESIGN_20260914.md
    script: research/universe_size_then_composition/stage3_conditional_size_direction.py
    target: sign_of_stage1_K30_minus_K3_mean_return_contrast
    objective: >-
      Test whether exactly five point-in-time coverage/competition/redundancy features can identify whether larger K is beneficial next month, using strict expanding OOS and no exact-K selection.
    primary_features: [active_share_t, score_iqr_t, prior20_switch_rate_t, prior20_top1_tenure_t, mean_pairwise_corr120_t]
    model: fixed_logistic_l2_C1_standardized_train_only
    min_train_months: 24
    baselines: [expanding_majority, previous_month_sign]
    no_k_selection: true

  - id: new_stage_4
    name: composition_oracle_within_frozen_k_range
    status: hold_until_stage3
    dependency: new_stage_3

  - id: new_stage_5
    name: walk_forward_executable_composition
    status: queued
    dependency: new_stage_4

anti_overfit_rules:
  - do_not_pick_a_precise_k_from_full_sample_and_reuse_same_history_as_oos
  - do_not_change_trend_episode_definition_to_improve_results
  - do_not_change_parent_pool_or_windows_after_seeing_k_results_without_new_frozen_stage
  - do_not_feature_search_stage3_after_outcome_inspection
  - prefer_range_and_mechanism_over_single_best_k
  - member_selection_modeling_starts_only_after_k_range_is_frozen
