research_line: universe_size_then_composition
started_at: 2026-09-14
status: active
previous_lineage:
  path: research/marginal_universe_value/
  status: frozen_historical_evidence
  rule: do_not_continue_old_stage_numbers

frozen_downstream_rule:
  name: original_ols_rotation
  note: downstream OLS logic must remain unchanged during size/composition mechanism research

stages:
  - id: new_stage_1
    name: oracle_universe_size_monte_carlo
    status: frozen
    decision: branch_to_stage2_mechanism
    findings_doc: research/universe_size_then_composition/STAGE1_FINDINGS_20260914.md
    objective: >-
      Determine whether reducing or increasing Universe size K has a general effect on
      one-month Frozen OLS value, and whether a stable favorable K range exists.
    primary_design:
      parent_pool: monthly_point_in_time_representative_etfs
      representative_rule: prior_day_eligibility_plus_120d_corr_liquidity_first_dedup
      primary_corr_threshold: 0.95
      predeclared_sensitivity_corr_threshold: 0.90
      k_range: 3..30_subject_to_monthly_availability
      sampling: independent_same_k_random_universes
      nested_deletion_paths: secondary_random_15_to_3
      cash_signal_forced: 511220
      fixed_rng_seed: 20260914
      evaluate_by_month: true
      oracle_usage: mechanism_diagnosis_only
    first_batch_20260914:
      source_run_id: 34772895471
      status: completed_success
      samples_per_k_per_month: 180
      nested_15_to_3_paths_per_month: 36
      months: 68
      sampled_universes: 374544
      key_evidence:
        overall_month_spearman_k_return_negative_share: 0.5735
        overall_month_spearman_below_minus_half_share: 0.5147
        era_2021_24_mean_month_spearman: -0.8757
        era_2021_24_k30_minus_k3_mean: -0.013862
        era_2021_24_month_bootstrap_95pct: [-0.02309, -0.00442]
        era_2025_26_mean_month_spearman: 0.0817
        era_2025_26_k30_minus_k3_mean: 0.011655
        era_2025_26_month_bootstrap_95pct: [-0.01559, 0.03958]
      mechanism_direction:
        k_up_switches_up: true
        k_up_observed_top1_tenure_down: true
        k_up_winner_coverage_up: true
        k_up_dormant_share_up: true
        k_up_effective_n_up_slowly: true
      data_quality_note: >-
        stage1_summary.json representative_pool_stats are invalid because the upstream
        representative stats include zero-count calendar buckets. Recomputed from
        monthly_parent_pool_snapshots: 68 nonempty months, mean parent size about 218.29,
        median 240, min 65, max 383. Raw MC outputs remain usable; no rerun is required.
    robustness_batch_20260914:
      source_run_id: 34775534691
      status: completed_success
      arms:
        - name: alt_seed
          seed: 20260915
          corr_threshold: 0.95
          era_2021_24_k30_minus_k3_mean: -0.013501
          era_2021_24_bootstrap_95pct: [-0.02329, -0.00350]
          era_2025_26_k30_minus_k3_mean: 0.012836
          era_2025_26_bootstrap_95pct: [-0.02145, 0.04650]
        - name: corr_090
          seed: 20260914
          corr_threshold: 0.90
          era_2021_24_k30_minus_k3_mean: -0.014080
          era_2021_24_bootstrap_95pct: [-0.02335, -0.00448]
          era_2025_26_k30_minus_k3_mean: 0.013632
          era_2025_26_bootstrap_95pct: [-0.01990, 0.04694]
      convergence:
        base_alt_seed_month_k_return_mean_corr: 0.99888
        base_alt_seed_month_shape_sign_agreement: 0.92647
        base_corr090_month_k_return_mean_corr: 0.99721
        base_corr090_month_shape_sign_agreement: 0.95588
      interpretation: >-
        Both predeclared robustness arms preserve the era reversal. The effect is not
        explained by one Monte Carlo seed or the 0.95 correlation-dedup threshold.
    frozen_conclusion: >-
      Universe size effect is regime-dependent. The geometry of increasing K is stable:
      winner coverage and competition/switching rise while observed Top1 tenure falls.
      The economic payoff reverses across eras. Stage1 does not support a universal exact K
      or global K range and must not be reused to pick one from the same history.

  - id: new_stage_2
    name: size_mechanism_remaining_trend_life
    status: registered_ready_to_run
    dependency: new_stage_1
    design_doc: research/universe_size_then_composition/STAGE2_TREND_EPISODE_REMAINING_LIFE_DESIGN_20260914.md
    script: research/universe_size_then_composition/stage2_remaining_trend_life.py
    objective: >-
      Test whether larger K changes first-Top1 admission timing within each ETF's own
      intrinsic trend episode, reducing true remaining trend life/return, while small K
      incurs the opposing winner-coverage cost.
    key_definition: >-
      Remaining trend life is the ETF's own residual intrinsic trend-episode life after
      its first Top1 admission in a sampled Universe/month, not consecutive observed Top1 tenure.
    frozen_episode_state: stage1_pool_score_nonnull
    effective_inference_unit: month
    primary_event_source: stage1_primary_same_k_mc_run_34772895471
    no_k_selection: true
    branch_rule: >-
      If late-admission/remaining-life structure is stable and helps explain Stage1 jointly
      with winner coverage, Stage3 may study low-DoF conditional K state/range. If not,
      reject this lifetime mechanism without redefining it.

  - id: new_stage_3
    name: stable_or_conditional_k_range
    status: hold_until_stage2
    dependency: new_stage_2

  - id: new_stage_4
    name: composition_oracle_within_frozen_k_range
    status: queued
    dependency: new_stage_3

  - id: new_stage_5
    name: walk_forward_executable_composition
    status: queued
    dependency: new_stage_4

anti_overfit_rules:
  - do_not_pick_a_precise_k_from_full_sample_and_reuse_same_history_as_oos
  - do_not_change_trend_episode_definition_to_improve_results
  - do_not_change_parent_pool_or_windows_after_seeing_k_results_without_new_frozen_stage
  - prefer_range_and_mechanism_over_single_best_k
  - member_selection_modeling_starts_only_after_k_range_is_frozen
