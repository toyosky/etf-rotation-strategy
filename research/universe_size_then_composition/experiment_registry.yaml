research_line: universe_size_then_composition
started_at: 2026-09-14
status: active
previous_lineage:
  path: research/marginal_universe_value/
  status: frozen_historical_evidence
  rule: do_not_continue_old_stage_numbers

frozen_downstream_rule:
  name: original_ols_rotation
  note: downstream OLS logic must remain unchanged during size/composition mechanism research

stages:
  - id: new_stage_1
    name: oracle_universe_size_monte_carlo
    status: running_first_long_batch
    objective: >-
      Determine whether reducing or increasing Universe size K has a general effect on
      one-month Frozen OLS value, and whether a stable favorable K range exists.
    primary_design:
      parent_pool: monthly_point_in_time_representative_etfs
      representative_rule: prior_day_eligibility_plus_120d_corr_liquidity_first_dedup
      primary_corr_threshold: 0.95
      predeclared_sensitivity_corr_threshold: 0.90
      k_range: 3..30_subject_to_monthly_availability
      sampling: independent_same_k_random_universes
      nested_deletion_paths: secondary_random_15_to_3
      cash_signal_forced: 511220
      fixed_rng_seed: 20260914
      evaluate_by_month: true
      oracle_usage: mechanism_diagnosis_only
    operational_batch_20260914:
      runner: research/universe_size_then_composition/stage1_oracle_size_mc.py
      workflow: .github/workflows/universe-size-stage1.yml
      samples_per_k_per_month: 180
      nested_15_to_3_paths_per_month: 36
      expected_artifact: universe-size-stage1-<run_id>
      after_artifact: >-
        Inspect full K distributions and nested paired deletion deltas before changing
        any threshold or definition. Then run predeclared seed-convergence and 0.90
        representative-pool sensitivity as warranted.
    required_outputs:
      - monthly_parent_pool_snapshots
      - sampled_universe_detail
      - monthly_k_distribution
      - nested_15_to_3_deltas
      - top1_admission_events
      - return_mean
      - return_median
      - return_p25
      - return_p75
      - return_p90
      - top_decile_probability
      - max_drawdown_distribution
      - switching_distribution
      - observed_top1_tenure_distribution
      - winner_coverage
      - dormant_member_share
      - pairwise_correlation_mean
      - effective_n
    mechanism_features_to_add_or_deepen_after_first_batch:
      - pairwise_correlation_median
      - pairwise_correlation_high_quantile
      - first_pc_share
      - asset_class_breadth
      - region_breadth
      - score_distribution
      - strong_trend_count
      - rank_turnover
    completion_rule: >-
      Freeze Stage 1 only after cross-month K-by-return distributions are produced with
      reproducible code/config/input version/random seeds and basic robustness checks.

  - id: new_stage_2
    name: size_mechanism_remaining_trend_life
    status: queued
    dependency: new_stage_1
    key_definition: >-
      Remaining trend life is the ETF's own residual trend-episode life after first OLS
      Top1 admission, not consecutive observed Top1 tenure inside a Universe.

  - id: new_stage_3
    name: stable_k_range
    status: queued
    dependency: new_stage_2

  - id: new_stage_4
    name: composition_oracle_within_frozen_k_range
    status: queued
    dependency: new_stage_3

  - id: new_stage_5
    name: walk_forward_executable_composition
    status: queued
    dependency: new_stage_4

anti_overfit_rules:
  - do_not_pick_a_precise_k_from_full_sample_and_reuse_same_history_as_oos
  - do_not_change_trend_episode_definition_to_improve_results
  - do_not_change_parent_pool_or_windows_after_seeing_k_results_without_new_frozen_stage
  - prefer_range_and_mechanism_over_single_best_k
  - member_selection_modeling_starts_only_after_k_range_is_frozen
