research_line: universe_size_then_composition
started_at: 2026-09-14
status: active
previous_lineage:
  path: research/marginal_universe_value/
  status: frozen_historical_evidence
  rule: do_not_continue_old_stage_numbers

frozen_downstream_rule:
  name: original_ols_rotation
  note: downstream OLS logic must remain unchanged during size/composition mechanism research

stages:
  - id: new_stage_1
    name: oracle_universe_size_monte_carlo
    status: frozen
    decision: branch_to_stage2_mechanism
    findings_doc: research/universe_size_then_composition/STAGE1_FINDINGS_20260914.md
    primary_corr_threshold: 0.95
    k_range: 3..30_subject_to_monthly_availability
    source_run_id: 34772895471
    robustness_run_id: 34775534691
    frozen_conclusion: >-
      Universe size effect is regime-dependent. K up raises winner coverage and competition/switching while observed Top1 tenure falls. The economic payoff reverses across eras. No universal exact K or global K range is supported.

  - id: new_stage_2
    name: size_mechanism_remaining_trend_life
    status: frozen
    decision: reject_strong_lifetime_return_mechanism
    source_run_id: 34778676590
    findings_doc: research/universe_size_then_composition/STAGE2_FINDINGS_20260914.md
    frozen_conclusion: >-
      Larger K robustly shifts first admission later in normalized intrinsic trend age and reduces remaining active days, but does not create a stable remaining-return penalty. Do not redefine lifetime.

  - id: new_stage_3
    name: conditional_size_direction_identifiability
    status: frozen
    decision: reject_low_dof_point_in_time_identifiability
    source_run_id: 34780943967
    findings_doc: research/universe_size_then_composition/STAGE3_FINDINGS_20260914.md
    frozen_conclusion: >-
      The frozen five-feature point-in-time state does not identify next-month size direction in expanding OOS. Do not rescue via feature search or model-capacity escalation on the same history.

  - id: new_stage_3b
    name: conservative_size_fallback_audit
    status: frozen
    decision: conservative_anchor_k15
    dependency: new_stage_3
    source_run_id: 34783843851
    source_artifact: universe-size-stage3b-34783843851
    design_doc: research/universe_size_then_composition/STAGE3B_CONSERVATIVE_SIZE_FALLBACK_DESIGN_20260914.md
    findings_doc: research/universe_size_then_composition/STAGE3B_FINDINGS_20260914.md
    anchor_k: 15
    evidence:
      oos_months: 44
      train_best_minus_k15_mean: -0.00124923
      paired_bootstrap_95pct: [-0.0110445, 0.0077947]
      era_2023_24_delta: 0.00706405
      era_2025_26_delta: -0.0112252
      train_best_k_median: 3
      train_best_k_changes: 3
      one_se_range_width_median: 8
      later_era_one_se_range_width_mean: 19.2
    frozen_conclusion: >-
      History-only expanding best-K does not stably outperform the pre-existing K15 anchor and reverses sign across eras. Stop treating dynamic size as an independently learnable layer. K15 is an engineering anchor only, not an optimal-K claim.

  - id: new_stage_4
    name: fixed_k15_composition_structure_audit
    status: registered_running
    decision: pending
    dependency: new_stage_3b
    anchor_k: 15
    design_doc: research/universe_size_then_composition/STAGE4_FIXED_K15_COMPOSITION_STRUCTURE_DESIGN_20260914.md
    script: research/universe_size_then_composition/stage4_fixed_k15_composition_structure.py
    workflow: .github/workflows/universe-size-stage4.yml
    objective: >-
      Before fitting any member selector, quantify whether composition at fixed K15 has material downstream value headroom and whether randomized member inclusion effects show enough cross-sample and adjacent-month stability to justify Stage5 identifiability modeling.

  - id: new_stage_5
    name: walk_forward_executable_composition
    status: hold_until_stage4
    dependency: new_stage_4

anti_overfit_rules:
  - do_not_pick_a_precise_k_from_full_sample_and_reuse_same_history_as_oos
  - do_not_change_trend_episode_definition_to_improve_results
  - do_not_change_parent_pool_or_windows_after_seeing_k_results_without_new_frozen_stage
  - do_not_feature_search_stage3_after_outcome_inspection
  - k15_after_stage3b_is_engineering_anchor_not_optimal_k_claim
  - stage4_uses_only_existing_stage1_k15_randomization_before_member_modeling
  - member_selection_modeling_starts_only_after_stage4_structure_audit
