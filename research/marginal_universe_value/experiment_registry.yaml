    primary_outputs: [muv-stage26-set-value-oracle-report.json, muv-stage26-set-value-oracle-months.csv, muv-stage26-set-value-oracle-steps.csv]
    notes: "Mainline reset: Fix15 is diagnostic only. Oracle uses future information solely for structural diagnosis/labels, never for executable selection. Universe size is endogenous; no fixed K search."
