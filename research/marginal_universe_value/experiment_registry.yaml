    parent_stage: stage25
    label_version: set_value_next20_fixed_ols_v2
    status: planned
    decision: continue
    hypothesis: "Under the frozen daily OLS selector, the future set-value landscape contains a nontrivial variable-size local optimum: a forward-add oracle reaches positive value through a finite sequence of additions, while the resulting size, marginal gains, switching and composition expose a repeatable coverage-versus-competition trade-off."
    target_scope: universe_set_value
    model_role: counterfactual_oracle_structure_audit
    scripts: [research/marginal_universe_value/audit_stage26_variable_size_set_value_oracle.py]
    workflow: .github/workflows/muv-stage26-variable-size-set-value-oracle.yml
