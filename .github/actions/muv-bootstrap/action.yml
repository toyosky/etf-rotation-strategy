name: MUV bootstrap

description: Shared Python setup and cached MUV retention-label build.

inputs:
  label-version:
    description: Logical label version, for example v1.4, v1.5 or v1.6.
    required: true
  builder:
    description: Path to the label builder Python script.
    required: true
  requirements:
    description: Requirements file used by MUV research.
    required: false
    default: research/requirements-full-market-ols.txt

outputs:
  cache-hit:
    description: Whether the label dataset was restored from cache.
    value: ${{ steps.label-cache.outputs.cache-hit }}
  freshness-bucket:
    description: UTC freshness bucket used in the cache key.
    value: ${{ steps.freshness.outputs.bucket }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ${{ inputs.requirements }}

    - name: Install dependencies
      shell: bash
      run: python -m pip install --requirement "${{ inputs.requirements }}"

    - name: Build market-data freshness bucket
      id: freshness
      shell: bash
      run: |
        day="$(date -u +%Y-%m-%d)"
        hour="$(date -u +%H)"
        if [ "$hour" -ge 16 ]; then
          phase="post-sync"
        else
          phase="pre-sync"
        fi
        echo "bucket=${day}-${phase}" >> "$GITHUB_OUTPUT"

    - name: Restore MUV label cache
      id: label-cache
      uses: actions/cache@v4
      with:
        path: |
          muv-retention-v1-summary.json
          muv-retention-labels-v1.parquet
        key: muv-labels-${{ inputs.label-version }}-${{ runner.os }}-${{ steps.freshness.outputs.bucket }}-${{ hashFiles('research/marginal_universe_value/build_retention_labels_v1*.py') }}

    - name: Build labels on cache miss
      if: steps.label-cache.outputs.cache-hit != 'true'
      shell: bash
      run: python "${{ inputs.builder }}" --skip-upload

    - name: Validate label outputs
      shell: bash
      run: |
        test -s muv-retention-v1-summary.json
        test -s muv-retention-labels-v1.parquet
        echo "MUV labels ready: version=${{ inputs.label-version }}, bucket=${{ steps.freshness.outputs.bucket }}, cache_hit=${{ steps.label-cache.outputs.cache-hit }}"
