name: Qualified Rebuild Premium Sync

on:
  workflow_run:
    workflows:
      - 'Fundamental Audit Trigger'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualified-rebuild-premium-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install required data dependencies
        run: python -m pip install --requirement automation/requirements-premium-history.txt
      - name: Validate premium universe separation
        run: python -m unittest automation.test_premium_dynamic
      - name: Sync newly qualified full-market rebuild candidates
        run: |
          python automation/premium_history_sync.py \
            --mode preopen --lookback-days 21 \
            --rebuild-report data/full-market-rebuild-latest.json \
            --new-rebuild-only --only-selected \
            --summary rebuild-qualified-premium-summary.json
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f rebuild-qualified-premium-summary.json ]; then
            cat rebuild-qualified-premium-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualified-rebuild-premium-${{ github.run_id }}
          path: rebuild-qualified-premium-summary.json
          if-no-files-found: ignore
