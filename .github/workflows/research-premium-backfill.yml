name: Research Premium Backfill (2014-2026)
on:
  push:
    branches: [research/top1-downside-20261120]
    paths: ['.github/workflows/research-premium-backfill.yml', 'research/top1_downside/code/premium_missing_backfill.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-premium-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol: ['159509','159529','159934','159957','159981','159985','161226','164824','501018','511380','512800','513100','513290','513530','513500','511220','510300','520870','159100']
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement automation/requirements-premium-history.txt
      - name: Backfill missing pairs from DWJZ and raw Tencent day bars
        run: python -m research.top1_downside.code.premium_missing_backfill --symbol ${{ matrix.symbol }} --output premium-${{ matrix.symbol }}.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: premium-${{ matrix.symbol }}
          path: premium-${{ matrix.symbol }}.json
          if-no-files-found: warn
          retention-days: 30
