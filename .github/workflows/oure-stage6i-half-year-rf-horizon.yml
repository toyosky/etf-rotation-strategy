name: OURE Stage6I Half-Year RF Horizon

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage6i_half_year_rf_horizon_diagnostic.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE6I_HALF_YEAR_RF_HORIZON_DIAGNOSTIC_DESIGN_20260914.md"
      - ".github/workflows/oure-stage6i-half-year-rf-horizon.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage6i_half_year_rf_horizon_diagnostic.py
      - name: Run Stage6I
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage6i_half_year_rf_horizon_diagnostic.py \
            --output-dir oure-stage6i-output
      - name: Upload Stage6I artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage6i-half-year-rf-horizon-${{ github.run_id }}
          path: oure-stage6i-output
          retention-days: 90
