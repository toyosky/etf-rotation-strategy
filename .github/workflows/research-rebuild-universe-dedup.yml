name: Research Rebuild Universe Dedup Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/rebuild_market_context/audit_universe_dedup_v1.py'
      - '.github/workflows/research-rebuild-universe-dedup.yml'
permissions:
  contents: write
concurrency:
  group: research-rebuild-universe-dedup
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install research dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "pyarrow>=18" "SQLAlchemy>=2,<3" "psycopg2-binary>=2.9,<3"
      - name: Compile research modules
        run: |
          python -m py_compile research/rebuild_market_context/compute_indicators_v1.py research/rebuild_market_context/audit_universe_dedup_v1.py
          python research/rebuild_market_context/compute_indicators_v1.py --self-test
      - name: Download audited full-market historical release
        run: |
          mkdir -p /tmp/rebuild-dedup
          gh release download research-data-fullmarket-current --repo "$GH_REPO" \
            --pattern refreshed_daily_bars.parquet --dir /tmp/rebuild-dedup
          test -s /tmp/rebuild-dedup/refreshed_daily_bars.parquet
      - name: Compare full/exposure/sector unique pools
        run: |
          python research/rebuild_market_context/audit_universe_dedup_v1.py \
            --parquet /tmp/rebuild-dedup/refreshed_daily_bars.parquet
      - name: Print summary
        if: success()
        run: cat research/rebuild_market_context/universe_extreme_value_audit_v1.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit research-only outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/rebuild_market_context/universe_extreme_value_audit_v1.json research/rebuild_market_context/universe_extreme_value_audit_v1.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: document candidate de-duplication and extreme-value comparison"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-universe-dedup-${{ github.run_id }}
          path: |
            research/rebuild_market_context/universe_extreme_value_audit_v1.json
            research/rebuild_market_context/universe_extreme_value_audit_v1.md
          if-no-files-found: warn
          retention-days: 30
