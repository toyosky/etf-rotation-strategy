name: MUV Retention Stage17 Local Relational

on:
  workflow_dispatch:
  push:
    paths:
      - "research/requirements-full-market-ols.txt"
      - "research/marginal_universe_value/build_retention_labels_v1.py"
      - "research/marginal_universe_value/build_retention_labels_v1_1.py"
      - "research/marginal_universe_value/build_retention_labels_v1_2.py"
      - "research/marginal_universe_value/build_retention_labels_v1_3.py"
      - "research/marginal_universe_value/build_retention_labels_v1_4.py"
      - "research/marginal_universe_value/build_retention_labels_v1_5.py"
      - "research/marginal_universe_value/model_retention_stage3_pairwise_sign.py"
      - "research/marginal_universe_value/model_retention_stage17_local_relational.py"
      - "research/marginal_universe_value/STAGE17_LOCAL_UNIVERSE_RELATIONAL_DESIGN_20260913.md"
      - ".github/workflows/muv-retention-stage17.yml"

permissions:
  contents: read

concurrency:
  group: muv-retention-stage17
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Build V1.5 local relational labels
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/marginal_universe_value/build_retention_labels_v1_5.py --skip-upload

      - name: Stage 17 local relational audit
        run: python research/marginal_universe_value/model_retention_stage17_local_relational.py

      - name: Show Stage17 report
        if: always()
        run: |
          if [ -f muv-retention-stage17-report.json ]; then
            cat muv-retention-stage17-report.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Stage17 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muv-retention-stage17-${{ github.run_id }}
          path: |
            muv-retention-v1-summary.json
            muv-retention-labels-v1.parquet
            muv-retention-stage17-report.json
            muv-retention-stage17-predictions.csv
          if-no-files-found: ignore
          retention-days: 30
