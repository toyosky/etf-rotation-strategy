name: MUV Stage26 Set-Value Oracle Structure Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "research/requirements-full-market-ols.txt"
      - "research/full_market_ols_storage.py"
      - "research/validate_fixed15_vs_full_market.py"
      - "research/walk_forward_candidate_pool.py"
      - "research/marginal_universe_value/model_stage26_set_value_oracle.py"
      - "research/marginal_universe_value/STAGE26_SET_VALUE_ORACLE_STRUCTURE_AUDIT_DESIGN_20260913.md"
      - "research/marginal_universe_value/experiment_registry.yaml"
      - ".github/actions/muv-publish/action.yml"
      - ".github/workflows/muv-stage26-set-value-oracle.yml"

permissions:
  contents: read

concurrency:
  group: muv-stage26-set-value-oracle
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Syntax check Stage26
        run: python -m py_compile research/marginal_universe_value/model_stage26_set_value_oracle.py

      - name: Run Stage26 set-value oracle structure audit
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/marginal_universe_value/model_stage26_set_value_oracle.py

      - name: Publish Stage26 outputs
        if: always()
        uses: ./.github/actions/muv-publish
        with:
          report-file: muv-stage26-set-value-oracle-report.json
          artifact-name: muv-stage26-set-value-oracle-${{ github.run_id }}
          paths: |
            muv-stage26-set-value-oracle-report.json
            muv-stage26-set-value-oracle-months.csv
            muv-stage26-set-value-oracle-labels.csv
