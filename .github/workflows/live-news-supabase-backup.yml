name: Live News Supabase Backup

on:
  schedule:
    - cron: '50 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export live news from Supabase
        run: node automation/sync_live_news_from_supabase.mjs
      - name: Commit backup if changed
        run: |
          if git diff --quiet -- data/live-news; then
            echo "No live-news backup changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-news
          git commit -m "data: backup live news from Supabase"
          git push
