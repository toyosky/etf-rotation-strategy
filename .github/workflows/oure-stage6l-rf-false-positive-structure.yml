name: OURE Stage6L RF False-Positive Structure

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage6l_rf_false_positive_structure.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE6L_RF_FALSE_POSITIVE_STRUCTURE_DESIGN_20260914.md"
      - ".github/workflows/oure-stage6l-rf-false-positive-structure.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage6l_rf_false_positive_structure.py
      - name: Run Stage6L
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage6l_rf_false_positive_structure.py \
            --output-dir oure-stage6l-output
      - name: Upload Stage6L artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage6l-rf-false-positive-structure-${{ github.run_id }}
          path: oure-stage6l-output
          retention-days: 90
