name: Research IV1.3 Oil Validation
on:
  push:
    branches: [research/top1-downside-20261120]
    paths: ['.github/workflows/research-iv13-oil-validation.yml', 'research/top1_downside/code/iv13_oil_validation.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iv13:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.5 scipy==1.18.1 scikit-learn
      - run: python research/top1_downside/code/iv13_oil_validation.py
      - uses: actions/upload-artifact@v7
        with:
          name: iv13-oil-validation
          path: |
            iv13_validation.json
            iv13_ovx.csv
          if-no-files-found: error
          retention-days: 30
