name: OURE Stage8T Cross Region Robustness
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/optimal_universe_reverse_engineering/oure_stage8t_cross_region_robustness.py'
      - '.github/workflows/oure-stage8t-cross-region-robustness.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
      PYTHONPATH: research
      OUTPUT_DIR: stage8t-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas sqlalchemy psycopg2-binary boto3 tabulate scipy
      - run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage8t_cross_region_robustness.py
      - run: python research/optimal_universe_reverse_engineering/oure_stage8t_cross_region_robustness.py
      - if: always()
        run: if [ -f "$OUTPUT_DIR/stage8t_summary.md" ]; then cat "$OUTPUT_DIR/stage8t_summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage8t-${{ github.run_id }}
          path: stage8t-output/
          retention-days: 30
