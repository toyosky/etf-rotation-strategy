name: OURE Stage6F Core Plus Challenge Veto

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage6f_core_plus_challenge_veto.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE6F_CORE_PLUS_CHALLENGE_VETO_DESIGN_20260914.md"
      - ".github/workflows/oure-stage6f-core-plus-veto.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements-full-market-ols.txt
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage6f_core_plus_challenge_veto.py
      - name: Run Stage6F
        env:
          PYTHONPATH: research
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: >-
          python research/optimal_universe_reverse_engineering/oure_stage6f_core_plus_challenge_veto.py
          --output-dir oure-stage6f-output
      - name: Upload Stage6F artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage6f-core-plus-veto-${{ github.run_id }}
          path: oure-stage6f-output/
          retention-days: 90
