name: MUV Retention Stage13 Bootstrap Uncertainty

on:
  workflow_dispatch:
  push:
    paths:
      - "research/requirements-full-market-ols.txt"
      - "research/marginal_universe_value/build_retention_labels_v1*.py"
      - "research/marginal_universe_value/model_retention_stage3_pairwise_sign.py"
      - "research/marginal_universe_value/model_retention_stage7_asymmetric_safety.py"
      - "research/marginal_universe_value/model_retention_stage13_bootstrap_uncertainty.py"
      - ".github/actions/muv-bootstrap/action.yml"
      - ".github/actions/muv-publish/action.yml"
      - ".github/workflows/muv-retention-stage13.yml"

permissions:
  contents: read

concurrency:
  group: muv-retention-stage13
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare V1.4 MUV labels
        uses: ./.github/actions/muv-bootstrap
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        with:
          label-version: v1.4
          builder: research/marginal_universe_value/build_retention_labels_v1_4.py

      - name: Stage 3 pairwise expected MUV
        run: python research/marginal_universe_value/model_retention_stage3_pairwise_sign.py

      - name: Stage 7 asymmetric safety baseline
        run: python research/marginal_universe_value/model_retention_stage7_asymmetric_safety.py

      - name: Stage 13 month-cluster bootstrap uncertainty
        run: python research/marginal_universe_value/model_retention_stage13_bootstrap_uncertainty.py

      - name: Publish Stage13 outputs
        if: always()
        uses: ./.github/actions/muv-publish
        with:
          report-file: muv-retention-stage13-report.json
          artifact-name: muv-retention-stage13-${{ github.run_id }}
          paths: |
            muv-retention-v1-summary.json
            muv-retention-labels-v1.parquet
            muv-retention-stage3-report.json
            muv-retention-stage3-predictions.csv
            muv-retention-stage7-report.json
            muv-retention-stage7-monthly-policy.csv
            muv-retention-stage7-safety-predictions.csv
            muv-retention-stage13-report.json
            muv-retention-stage13-bootstrap-predictions.csv
            muv-retention-stage13-stage7-veto.csv
            muv-retention-stage13-ucb-policy.csv
