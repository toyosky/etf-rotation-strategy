name: OURE Stage8Z Void Deterioration

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/optimal_universe_reverse_engineering/oure_stage8z_void_deterioration_backtest.py'
      - '.github/workflows/oure-stage8z-void-deterioration.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
      PYTHONPATH: research
      OUTPUT_DIR: stage8z-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas sqlalchemy psycopg2-binary boto3 tabulate scipy
      - run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage8z_void_deterioration_backtest.py
      - run: python research/optimal_universe_reverse_engineering/oure_stage8z_void_deterioration_backtest.py
      - run: |
          if [ -f "$OUTPUT_DIR/stage8z_summary.md" ]; then cat "$OUTPUT_DIR/stage8z_summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: oure-stage8z-${{ github.run_id }}
          path: stage8z-output/
          retention-days: 30
