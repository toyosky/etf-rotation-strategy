name: Universe Size Stage1 Monte Carlo Repair

on:
  workflow_dispatch:
  push:
    paths:
      - "research/universe_size_then_composition/stage1_oracle_size_mc_safe.py"
      - ".github/workflows/universe-size-stage1-repair.yml"

permissions:
  contents: read

concurrency:
  group: universe-size-stage1-repair
  cancel-in-progress: false

jobs:
  stage1-long-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Compile Stage1 persistence wrapper
        run: |
          python -m py_compile research/universe_size_then_composition/stage1_oracle_size_mc.py
          python -m py_compile research/universe_size_then_composition/stage1_oracle_size_mc_safe.py

      - name: Run frozen full-history Stage1 batch
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/universe_size_then_composition/stage1_oracle_size_mc_safe.py \
            --samples-per-k 180 \
            --nested-paths 36 \
            --seed 20260914 \
            --corr-threshold 0.95 \
            --output-dir stage1-size-mc-output

      - name: Show compact summary
        if: always()
        run: |
          if [ -f stage1-size-mc-output/stage1_summary.json ]; then
            cat stage1-size-mc-output/stage1_summary.json
          fi

      - name: Upload Stage1 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-size-stage1-repair-${{ github.run_id }}
          path: stage1-size-mc-output/
          if-no-files-found: warn
          retention-days: 30
