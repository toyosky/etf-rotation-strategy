name: OURE Stage8A Opportunity30

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage8a_opportunity30.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE8A_OPPORTUNITY30_DESIGN_20260915.md"
      - ".github/workflows/oure-stage8a-opportunity30.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3 pyarrow
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage8a_opportunity30.py
      - name: Run Stage8A
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage8a_opportunity30.py \
            --output-dir oure-stage8a-output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage8a-opportunity30-${{ github.run_id }}
          path: oure-stage8a-output/
          retention-days: 90
