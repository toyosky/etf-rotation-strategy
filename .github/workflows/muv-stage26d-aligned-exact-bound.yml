name: MUV Stage26D Aligned Exact Bound Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "research/requirements-full-market-ols.txt"
      - "research/full_market_ols_storage.py"
      - "research/validate_fixed15_vs_full_market.py"
      - "research/walk_forward_candidate_pool.py"
      - "research/marginal_universe_value/model_stage26_set_value_oracle.py"
      - "research/marginal_universe_value/run_stage26_set_value_oracle_compressed.py"
      - "research/marginal_universe_value/run_stage26d_aligned_exact_bound.py"
      - "research/marginal_universe_value/STAGE26D_ALIGNED_EXACT_BOUND_AUDIT_DESIGN_20260913.md"
      - "research/marginal_universe_value/experiment_registry.yaml"
      - ".github/actions/muv-publish/action.yml"
      - ".github/workflows/muv-stage26d-aligned-exact-bound.yml"

permissions:
  contents: read

concurrency:
  group: muv-stage26d-aligned-exact-bound
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Syntax check Stage26D
        run: |
          python -m py_compile research/marginal_universe_value/model_stage26_set_value_oracle.py
          python -m py_compile research/marginal_universe_value/run_stage26_set_value_oracle_compressed.py
          python -m py_compile research/marginal_universe_value/run_stage26d_aligned_exact_bound.py

      - name: Run Stage26D aligned exact bound audit
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/marginal_universe_value/run_stage26d_aligned_exact_bound.py

      - name: Publish Stage26D outputs
        if: always()
        uses: ./.github/actions/muv-publish
        with:
          report-file: muv-stage26d-aligned-exact-bound-report.json
          artifact-name: muv-stage26d-aligned-exact-bound-${{ github.run_id }}
          paths: |
            muv-stage26d-aligned-exact-bound-report.json
            muv-stage26d-aligned-exact-bound-months.csv
            muv-stage26d-aligned-exact-bound-labels.csv
