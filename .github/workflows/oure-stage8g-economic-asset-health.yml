name: OURE Stage8G Economic Asset Health

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research/optimal_universe_reverse_engineering/oure_stage8g_economic_asset_health.py'
      - '.github/workflows/oure-stage8g-economic-asset-health.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q numpy pandas sqlalchemy psycopg2-binary boto3 scikit-learn
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage8g_economic_asset_health.py
      - name: Run Stage8G
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/optimal_universe_reverse_engineering/oure_stage8g_economic_asset_health.py --output-dir oure-stage8g-output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage8g-economic-asset-health-${{ github.run_id }}
          path: oure-stage8g-output/
          retention-days: 90
