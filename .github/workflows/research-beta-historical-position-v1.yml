name: Research Beta Historical Position V1
on:
  workflow_dispatch:
  push:
    branches:
      - research/taxonomy-rebuild-validation-20261112
    paths:
      - 'research/taxonomy_v3/audit_beta_historical_position_v1.py'
      - 'research/taxonomy_v3/audit_middle40_two_definitions_v1.py'
      - '.github/workflows/research-beta-historical-position-v1.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2.2,<3' 'numpy>=2,<3' 'pyarrow>=18,<24'
      - name: Compile and self-test
        run: |
          python -m py_compile research/taxonomy_v3/audit_beta_historical_position_v1.py
          python research/taxonomy_v3/audit_beta_historical_position_v1.py --self-test
          python research/taxonomy_v3/audit_middle40_two_definitions_v1.py --self-test
      - name: Download and verify archive
        run: |
          mkdir -p /tmp/beta-research
          gh release download research-data-fullmarket-current --repo "$GH_REPO" --pattern refreshed_daily_bars.parquet --dir /tmp/beta-research
          echo '7a218407280309b475998668ccd3d232cfc67efda307f97db3f76fef7324b644  /tmp/beta-research/refreshed_daily_bars.parquet' | sha256sum -c -
      - name: Execute beta audit
        run: |
          python research/taxonomy_v3/audit_beta_historical_position_v1.py --bars /tmp/beta-research/refreshed_daily_bars.parquet --taxonomy research/taxonomy_v3/output_v32/classifications.parquet
      - name: Compare two middle40 strategies
        run: |
          python research/taxonomy_v3/audit_middle40_two_definitions_v1.py --bars /tmp/beta-research/refreshed_daily_bars.parquet --taxonomy research/taxonomy_v3/output_v32/classifications.parquet
      - name: Publish outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/taxonomy_v3/output_v32/beta_historical_position_v1.json research/taxonomy_v3/output_v32/beta_historical_position_v1.md research/taxonomy_v3/output_v32/middle40_two_definitions_v1.json research/taxonomy_v3/output_v32/middle40_two_definitions_v1.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: archive beta historical percentile results'
          git pull --rebase origin research/taxonomy-rebuild-validation-20261112
          git push origin HEAD:research/taxonomy-rebuild-validation-20261112
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-historical-position-${{ github.run_id }}
          path: research/taxonomy_v3/output_v32/beta_historical_position_v1.*
          if-no-files-found: warn
