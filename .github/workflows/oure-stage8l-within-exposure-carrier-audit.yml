name: OURE Stage8L Within-Exposure Carrier Audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research/optimal_universe_reverse_engineering/oure_stage8l_within_exposure_carrier_audit.py'
      - '.github/workflows/oure-stage8l-within-exposure-carrier-audit.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q numpy pandas sqlalchemy psycopg2-binary boto3 scikit-learn
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage8l_within_exposure_carrier_audit.py
      - name: Run Stage8L
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/optimal_universe_reverse_engineering/oure_stage8l_within_exposure_carrier_audit.py --output-dir oure-stage8l-output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage8l-within-exposure-carrier-audit-${{ github.run_id }}
          path: oure-stage8l-output/
          retention-days: 90
