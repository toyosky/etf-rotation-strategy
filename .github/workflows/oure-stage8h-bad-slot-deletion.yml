name: OURE Stage8H Bad Slot Deletion

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research/optimal_universe_reverse_engineering/oure_stage8h_bad_slot_deletion.py'
      - '.github/workflows/oure-stage8h-bad-slot-deletion.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q numpy pandas sqlalchemy psycopg2-binary boto3 scikit-learn
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage8h_bad_slot_deletion.py
      - name: Run Stage8H
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/optimal_universe_reverse_engineering/oure_stage8h_bad_slot_deletion.py --output-dir oure-stage8h-output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage8h-bad-slot-deletion-${{ github.run_id }}
          path: oure-stage8h-output/
          retention-days: 90
