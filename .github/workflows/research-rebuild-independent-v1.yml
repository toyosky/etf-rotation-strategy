name: Research Rebuild Independent Predictive Value V1
on:
  push:
    branches:
      - research/rebuild-independent-value-20261113
    paths:
      - research/rebuild_independent_value/audit_v1.py
      - .github/workflows/research-rebuild-independent-v1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  matched-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research dependencies
        run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'pyarrow>=18,<24'
      - name: Prepare immutable frozen snapshot
        run: |
          mkdir -p /tmp/rebuild-independent-evidence
          gh release download research-data-fullmarket-current --repo "$GH_REPO" --pattern refreshed_daily_bars.parquet --dir /tmp/rebuild-independent-evidence || true
          expected='9d55f6e0a511be72609e799b19d04c1b44e2555374298bceef102a0481a067fb'
          actual=$(sha256sum /tmp/rebuild-independent-evidence/refreshed_daily_bars.parquet 2>/dev/null | cut -d' ' -f1 || true)
          if [ "$actual" != "$expected" ]; then
            rm -f /tmp/rebuild-independent-evidence/refreshed_daily_bars.parquet
            git fetch origin research/taxonomy-v3-evidence-20261112 --depth=1
            git show 8037109205eb36a3514c5f14d8f2f8c2dba3d351:research/taxonomy_v3/archive/taxonomy-v3-evidence-20261112.tar.gz > /tmp/rebuild-independent-evidence/frozen.tar.gz
            tar -xzf /tmp/rebuild-independent-evidence/frozen.tar.gz -C /tmp/rebuild-independent-evidence
            cp /tmp/rebuild-independent-evidence/refreshed_daily_bars.parquet /tmp/rebuild-independent-evidence/refreshed_daily_bars_verified.parquet
            mv /tmp/rebuild-independent-evidence/refreshed_daily_bars_verified.parquet /tmp/rebuild-independent-evidence/refreshed_daily_bars.parquet
          fi
          echo "$expected  /tmp/rebuild-independent-evidence/refreshed_daily_bars.parquet" | sha256sum -c -
          test -s research/taxonomy_v3/output_v32/classifications.parquet
      - name: Compile and execute independent matched audit
        run: |
          python -m py_compile research/rebuild_independent_value/audit_v1.py
          python -m research.rebuild_independent_value.audit_v1 \
            --bars /tmp/rebuild-independent-evidence/refreshed_daily_bars.parquet \
            --taxonomy research/taxonomy_v3/output_v32/classifications.parquet
          python -m research.rebuild_independent_value.audit_v1 \
            --bars /tmp/rebuild-independent-evidence/refreshed_daily_bars.parquet \
            --taxonomy research/taxonomy_v3/output_v32/classifications.parquet \
            --min-turnover 0 \
            --out research/rebuild_independent_value/no_turnover_floor
      - name: Publish report to workflow summary
        if: success()
        run: cat research/rebuild_independent_value/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          echo '---' >> "$GITHUB_STEP_SUMMARY"
          cat research/rebuild_independent_value/no_turnover_floor/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit research reports only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/rebuild_independent_value/REPORT.md research/rebuild_independent_value/result.json research/rebuild_independent_value/no_turnover_floor/REPORT.md research/rebuild_independent_value/no_turnover_floor/result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record matched counterfactual ETF rebuild results'
          git push origin HEAD:research/rebuild-independent-value-20261113
      - name: Upload individual audit pairs for reproducibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-independent-v1-${{ github.run_id }}
          path: |
            research/rebuild_independent_value/REPORT.md
            research/rebuild_independent_value/result.json
            research/rebuild_independent_value/*_pairs.csv.gz
            research/rebuild_independent_value/no_turnover_floor/REPORT.md
            research/rebuild_independent_value/no_turnover_floor/result.json
            research/rebuild_independent_value/no_turnover_floor/*_pairs.csv.gz
          retention-days: 30
          if-no-files-found: warn
