name: Research IV1.1 All-session Oil Risk
on:
  push:
    branches: [research/top1-downside-20261120]
    paths: ['.github/workflows/research-iv11-oil.yml', 'research/top1_downside/code/iv11_oil_all_sessions.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iv11:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.5 scipy==1.18.1 scikit-learn
      - run: python research/top1_downside/code/iv11_oil_all_sessions.py
      - uses: actions/upload-artifact@v7
        with:
          name: iv11-oil-risk
          path: |
            iv11_oil_results.json
            iv11_ovx.csv
          if-no-files-found: error
          retention-days: 30
