name: Universe Size Stage3B Conservative Size Fallback

on:
  workflow_dispatch:
  push:
    paths:
      - "research/universe_size_then_composition/STAGE3B_CONSERVATIVE_SIZE_FALLBACK_DESIGN_20260914.md"
      - "research/universe_size_then_composition/stage3b_conservative_size_fallback.py"
      - ".github/workflows/universe-size-stage3b.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Syntax check
        run: python -m py_compile research/universe_size_then_composition/stage3b_conservative_size_fallback.py
      - name: Download frozen Stage1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34772895471 -n universe-size-stage1-repair-34772895471 -D stage1-artifact
      - name: Run frozen Stage3B audit
        run: python research/universe_size_then_composition/stage3b_conservative_size_fallback.py --stage1-dir stage1-artifact --output-dir stage3b-output
      - name: Upload Stage3B artifact
        uses: actions/upload-artifact@v4
        with:
          name: universe-size-stage3b-${{ github.run_id }}
          path: stage3b-output/
          retention-days: 90
