name: OURE Stage8P Defensive Anchor Audit

on:
  push:
    paths:
      - 'research/optimal_universe_reverse_engineering/oure_stage8p_defensive_anchor_audit.py'
      - '.github/workflows/oure-stage8p-defensive-anchor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
      PYTHONPATH: research
      OUTPUT_DIR: stage8p-defensive-anchor-output

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas sqlalchemy psycopg2-binary boto3 tabulate

      - name: Compile audit
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage8p_defensive_anchor_audit.py

      - name: Run audit
        run: python research/optimal_universe_reverse_engineering/oure_stage8p_defensive_anchor_audit.py

      - name: Publish summary
        if: always()
        run: |
          if [ -f "$OUTPUT_DIR/stage8p_summary.md" ]; then
            cat "$OUTPUT_DIR/stage8p_summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage8p-defensive-anchor-${{ github.run_id }}
          path: stage8p-defensive-anchor-output/
          retention-days: 30
