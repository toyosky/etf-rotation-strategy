name: Research Rebuild Continuous Factors V3
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/rebuild_market_context/audit_continuous_v3.py'
      - '.github/workflows/research-rebuild-continuous-v3.yml'
permissions:
  contents: write
concurrency:
  group: research-rebuild-continuous-v3
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "pyarrow>=18" "SQLAlchemy>=2,<3" "psycopg2-binary>=2.9,<3"
      - name: Compile continuous and upstream factors
        run: |
          python -m py_compile research/rebuild_market_context/compute_indicators_v1.py research/rebuild_market_context/audit_diffusion_v2.py research/rebuild_market_context/audit_continuous_v3.py
          python research/rebuild_market_context/compute_indicators_v1.py --self-test
      - name: Read frozen full-market historical archive
        run: |
          mkdir -p /tmp/etf-continuous-v3
          gh release download research-data-fullmarket-current --repo "$GH_REPO" \
            --pattern refreshed_daily_bars.parquet --dir /tmp/etf-continuous-v3
          test -s /tmp/etf-continuous-v3/refreshed_daily_bars.parquet
      - name: Run continuous factor audit and month block bootstraps
        run: |
          python research/rebuild_market_context/audit_continuous_v3.py \
            --parquet /tmp/etf-continuous-v3/refreshed_daily_bars.parquet
      - name: Publish brief summary
        if: success()
        run: cat research/rebuild_market_context/continuous_factor_audit_v3.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit research-only report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/rebuild_market_context/continuous_factor_audit_v3.json research/rebuild_market_context/continuous_factor_audit_v3.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: continuous ETF rebuild factor validation V3"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-continuous-v3-${{ github.run_id }}
          path: |
            research/rebuild_market_context/continuous_factor_audit_v3.json
            research/rebuild_market_context/continuous_factor_audit_v3.md
          if-no-files-found: warn
          retention-days: 30
