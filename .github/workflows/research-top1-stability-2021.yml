name: Research Top1 Stable Comparison 2021-2026
on:
  push:
    branches:
      - research/top1-stability-2021-20261113
    paths:
      - 'research/taxonomy_v3/audit_top1_stability_2021_v1.py'
      - '.github/workflows/research-top1-stability-2021.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-top1-stability-2021
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=2,<3' 'pyarrow>=18,<24'
      - name: Compile and unit checks
        run: |
          python -m py_compile research/taxonomy_v3/audit_top1_stability_2021_v1.py research/taxonomy_v3/audit_top1_extreme_quality_v1.py research/taxonomy_v3/audit_exact_rebuild_v1.py
          python research/taxonomy_v3/audit_top1_stability_2021_v1.py --self-test
      - name: Recover original immutable archive from independent evidence commit
        run: |
          mkdir -p /tmp/top1-2021
          git fetch origin research/taxonomy-v3-evidence-20261112
          git show 8037109205eb36a3514c5f14d8f2f8c2dba3d351:research/taxonomy_v3/archive/taxonomy-v3-evidence-20261112.tar.gz > /tmp/top1-2021/frozen.tar.gz
          echo '1c21c656a1de052f8263b453ed800c7146dd919bc8825bde8a5a906bc9bbeb8d  /tmp/top1-2021/frozen.tar.gz' | sha256sum --check
          TAR_MEMBER=$(tar -tzf /tmp/top1-2021/frozen.tar.gz | grep -E '(^|/)refreshed_daily_bars[.]parquet$' | head -1)
          test -n "$TAR_MEMBER"
          tar -xOf /tmp/top1-2021/frozen.tar.gz "$TAR_MEMBER" > /tmp/top1-2021/refreshed_daily_bars.parquet
          echo '9d55f6e0a511be72609e799b19d04c1b44e2555374298bceef102a0481a067fb  /tmp/top1-2021/refreshed_daily_bars.parquet' | sha256sum --check
      - name: Extend 2021-26 baseline and annual out-of-sample P99
        run: |
          python research/taxonomy_v3/audit_top1_stability_2021_v1.py \
            --bars /tmp/top1-2021/refreshed_daily_bars.parquet \
            --taxonomy research/taxonomy_v3/output_v32/classifications.parquet \
            --summary research/taxonomy_v3/output_v32/summary.json \
            --baseline research/taxonomy_v3/output_v32/top1_extreme_quality_v1.json
      - name: Publish research summary
        if: success()
        run: cat research/taxonomy_v3/output_v32/top1_stability_2021_v1.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit research-only outputs
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/taxonomy_v3/output_v32/top1_stability_2021_v1.json research/taxonomy_v3/output_v32/top1_stability_2021_v1.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: archive 2021-26 Top1 screening stability audit'
          git pull --rebase origin research/top1-stability-2021-20261113
          git push origin HEAD:research/top1-stability-2021-20261113
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top1-stability-2021-${{ github.run_id }}
          path: |
            research/taxonomy_v3/output_v32/top1_stability_2021_v1.json
            research/taxonomy_v3/output_v32/top1_stability_2021_v1.md
          if-no-files-found: warn
          retention-days: 30
