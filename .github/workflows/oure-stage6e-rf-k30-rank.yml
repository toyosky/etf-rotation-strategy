name: OURE Stage6E RF K30 Rank

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage6e_rf_k30_rank.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE6E_RF_K30_RANK_DESIGN_20260914.md"
      - ".github/workflows/oure-stage6e-rf-k30-rank.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage6e_rf_k30_rank.py
      - name: Run Stage6E
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage6e_rf_k30_rank.py \
            --output-dir oure-stage6e-output
      - name: Upload Stage6E artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage6e-rf-k30-rank-${{ github.run_id }}
          path: oure-stage6e-output
          retention-days: 90
