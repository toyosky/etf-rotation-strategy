name: Cashflow Factor Pre-Rebuild Lead-in Study
on:
  push:
    paths:
      - 'research/rebuild_diffusion/cashflow_lead_in_study.py'
      - '.github/workflows/research-cashflow-lead-in.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-cashflow-lead-in
  cancel-in-progress: true
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "pyarrow>=18" "SQLAlchemy>=2,<3"
      - name: Verify
        run: python -m py_compile research/rebuild_diffusion/cashflow_lead_in_study.py
      - name: Download archive
        run: |
          mkdir -p /tmp/fullmarket
          gh release download research-data-fullmarket-current --repo "$GH_REPO" --pattern refreshed_daily_bars.parquet --dir /tmp/fullmarket
          test -s /tmp/fullmarket/refreshed_daily_bars.parquet
      - name: Run lead-in analysis
        run: |
          python -m research.rebuild_diffusion.cashflow_lead_in_study \
            --parquet /tmp/fullmarket/refreshed_daily_bars.parquet \
            --out research/rebuild_diffusion/cashflow_lead_in_results.json
      - name: Commit study
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/rebuild_diffusion/cashflow_lead_in_results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: archive factor lead-in relative strength history"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashflow-lead-in-${{ github.run_id }}
          path: research/rebuild_diffusion/cashflow_lead_in_results.json
          if-no-files-found: warn
