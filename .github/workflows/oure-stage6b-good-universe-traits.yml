name: OURE Stage6B 2022-24 Good Universe Traits

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage6b_2022_2024_good_universe_traits.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE6B_2022_2024_GOOD_UNIVERSE_TRAITS_DESIGN_20260914.md"
      - ".github/workflows/oure-stage6b-good-universe-traits.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements-full-market-ols.txt
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage6b_2022_2024_good_universe_traits.py
      - name: Run Stage6B
        env:
          PYTHONPATH: research
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/optimal_universe_reverse_engineering/oure_stage6b_2022_2024_good_universe_traits.py --output-dir oure-stage6b-output
      - name: Upload Stage6B artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage6b-good-universe-traits-${{ github.run_id }}
          path: oure-stage6b-output/
          retention-days: 90
