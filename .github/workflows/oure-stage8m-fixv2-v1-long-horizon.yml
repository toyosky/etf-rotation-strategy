name: OURE Stage8M FixV2 V1 Long Horizon

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research/optimal_universe_reverse_engineering/oure_stage8m_fixv2_v1_long_horizon.py'
      - '.github/workflows/oure-stage8m-fixv2-v1-long-horizon.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q numpy pandas sqlalchemy psycopg2-binary boto3 scikit-learn
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage8m_fixv2_v1_long_horizon.py
      - name: Run Stage8M
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/optimal_universe_reverse_engineering/oure_stage8m_fixv2_v1_long_horizon.py --output-dir oure-stage8m-output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage8m-fixv2-v1-long-horizon-${{ github.run_id }}
          path: oure-stage8m-output/
          retention-days: 90
