name: Universe Size Stage4 Fixed K15 Composition Structure

on:
  workflow_dispatch:
  push:
    paths:
      - "research/universe_size_then_composition/STAGE4_FIXED_K15_COMPOSITION_STRUCTURE_DESIGN_20260914.md"
      - "research/universe_size_then_composition/stage4_fixed_k15_composition_structure.py"
      - ".github/workflows/universe-size-stage4.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pandas numpy pyarrow
      - name: Syntax check
        run: python -m py_compile research/universe_size_then_composition/stage4_fixed_k15_composition_structure.py
      - name: Download frozen Stage1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34772895471 -n universe-size-stage1-repair-34772895471 -D stage1-artifact
      - name: Run frozen Stage4 audit
        run: python research/universe_size_then_composition/stage4_fixed_k15_composition_structure.py --stage1-dir stage1-artifact --output-dir stage4-output
      - name: Upload Stage4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: universe-size-stage4-${{ github.run_id }}
          path: stage4-output/
          retention-days: 90
