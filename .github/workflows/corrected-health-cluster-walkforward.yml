name: Corrected Health Cluster Walk Forward

on:
  push:
    paths:
      - 'research/corrected_health_cluster_walkforward.py'
      - '.github/workflows/corrected-health-cluster-walkforward.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Run corrected health and cluster walk-forward
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/corrected_health_cluster_walkforward.py \
            --summary-path corrected-health-cluster-summary.json \
            --admission-path corrected-health-admission.csv
      - name: Show summary
        run: |
          cat corrected-health-cluster-summary.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat corrected-health-cluster-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-health-cluster-${{ github.run_id }}
          path: |
            corrected-health-cluster-summary.json
            corrected-health-admission.csv
          retention-days: 30
