name: OURE Register Stage6O

on:
  push:
    paths:
      - ".github/workflows/oure-register-stage6o.yml"
      - "research/optimal_universe_reverse_engineering/register_stage6o_registry.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update registry
        run: python research/optimal_universe_reverse_engineering/register_stage6o_registry.py
      - name: Commit registry
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/optimal_universe_reverse_engineering/OURE_EXPERIMENT_REGISTRY_20260914.yaml
          git commit -m "research: register frozen Stage6O conclusion"
          git push
