name: MUV Retention Stage18 Explicit Displacement

on:
  workflow_dispatch:
  push:
    paths:
      - "research/requirements-full-market-ols.txt"
      - "research/marginal_universe_value/build_retention_labels_v1.py"
      - "research/marginal_universe_value/build_retention_labels_v1_1.py"
      - "research/marginal_universe_value/build_retention_labels_v1_2.py"
      - "research/marginal_universe_value/build_retention_labels_v1_3.py"
      - "research/marginal_universe_value/build_retention_labels_v1_4.py"
      - "research/marginal_universe_value/build_retention_labels_v1_5.py"
      - "research/marginal_universe_value/build_retention_labels_v1_6.py"
      - "research/marginal_universe_value/model_retention_stage18_displacement_audit.py"
      - "research/marginal_universe_value/STAGE18_EXPLICIT_PATH_DISPLACEMENT_DESIGN_20260913.md"
      - ".github/workflows/muv-retention-stage18.yml"

permissions:
  contents: read

concurrency:
  group: muv-retention-stage18
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Build V1.6 displacement labels
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/marginal_universe_value/build_retention_labels_v1_6.py --skip-upload

      - name: Stage 18 explicit displacement audit
        run: python research/marginal_universe_value/model_retention_stage18_displacement_audit.py

      - name: Show Stage18 report
        if: always()
        run: |
          if [ -f muv-retention-stage18-report.json ]; then
            cat muv-retention-stage18-report.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Stage18 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muv-retention-stage18-${{ github.run_id }}
          path: |
            muv-retention-v1-summary.json
            muv-retention-labels-v1.parquet
            muv-retention-stage18-report.json
            muv-retention-stage18-active.csv
          if-no-files-found: ignore
          retention-days: 30
