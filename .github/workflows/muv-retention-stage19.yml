name: MUV Retention Stage19 Dynamic Replacement Reachability

on:
  workflow_dispatch:
  push:
    paths:
      - "research/requirements-full-market-ols.txt"
      - "research/marginal_universe_value/build_retention_labels_v1*.py"
      - "research/marginal_universe_value/build_stage19_replacement_pairs.py"
      - "research/marginal_universe_value/model_retention_stage19_replacement_reachability.py"
      - "research/marginal_universe_value/STAGE19_DYNAMIC_REPLACEMENT_REACHABILITY_DESIGN_20260913.md"
      - "research/marginal_universe_value/experiment_registry.yaml"
      - ".github/actions/muv-bootstrap/action.yml"
      - ".github/actions/muv-publish/action.yml"
      - ".github/workflows/muv-retention-stage19.yml"

permissions:
  contents: read

concurrency:
  group: muv-retention-stage19
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare V1.6 MUV labels
        uses: ./.github/actions/muv-bootstrap
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        with:
          label-version: v1.6
          builder: research/marginal_universe_value/build_retention_labels_v1_6.py

      - name: Build Stage19 replacement candidate pairs
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/marginal_universe_value/build_stage19_replacement_pairs.py

      - name: Stage19 dynamic replacement reachability audit
        run: python research/marginal_universe_value/model_retention_stage19_replacement_reachability.py

      - name: Publish Stage19 outputs
        if: always()
        uses: ./.github/actions/muv-publish
        with:
          report-file: muv-retention-stage19-report.json
          artifact-name: muv-retention-stage19-${{ github.run_id }}
          paths: |
            muv-retention-v1-summary.json
            muv-retention-labels-v1.parquet
            muv-retention-stage19-pairs.parquet
            muv-retention-stage19-report.json
            muv-retention-stage19-event-ranks.csv
