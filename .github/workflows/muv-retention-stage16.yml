name: MUV Retention Stage16 Activity Conditional Sign

on:
  workflow_dispatch:
  push:
    paths:
      - "research/requirements-full-market-ols.txt"
      - "research/marginal_universe_value/build_retention_labels_v1.py"
      - "research/marginal_universe_value/build_retention_labels_v1_1.py"
      - "research/marginal_universe_value/build_retention_labels_v1_2.py"
      - "research/marginal_universe_value/build_retention_labels_v1_3.py"
      - "research/marginal_universe_value/build_retention_labels_v1_4.py"
      - "research/marginal_universe_value/model_retention_stage3_pairwise_sign.py"
      - "research/marginal_universe_value/model_retention_stage16_activity_conditional_sign.py"
      - ".github/workflows/muv-retention-stage16.yml"

permissions:
  contents: read

concurrency:
  group: muv-retention-stage16
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Build V1.4 labels locally
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/marginal_universe_value/build_retention_labels_v1_4.py --skip-upload

      - name: Stage 3 pairwise expected MUV
        run: python research/marginal_universe_value/model_retention_stage3_pairwise_sign.py

      - name: Stage 16 activity-conditioned sign audit
        run: python research/marginal_universe_value/model_retention_stage16_activity_conditional_sign.py

      - name: Show Stage16 report
        if: always()
        run: |
          if [ -f muv-retention-stage16-report.json ]; then
            cat muv-retention-stage16-report.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Stage16 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muv-retention-stage16-${{ github.run_id }}
          path: |
            muv-retention-v1-summary.json
            muv-retention-labels-v1.parquet
            muv-retention-stage3-report.json
            muv-retention-stage3-predictions.csv
            muv-retention-stage16-report.json
            muv-retention-stage16-activity-curve.csv
            muv-retention-stage16-period-curve.csv
          if-no-files-found: ignore
          retention-days: 30
