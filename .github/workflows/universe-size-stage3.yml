name: Universe Size Stage3 Conditional Size Direction

on:
  workflow_dispatch:
  push:
    paths:
      - "research/universe_size_then_composition/stage3_conditional_size_direction.py"
      - "research/universe_size_then_composition/STAGE3_CONDITIONAL_SIZE_DIRECTION_DESIGN_20260914.md"
      - ".github/workflows/universe-size-stage3.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: universe-size-stage3-direction
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Syntax check Stage3
        run: python -m py_compile research/universe_size_then_composition/stage3_conditional_size_direction.py

      - name: Download frozen Stage1 primary artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stage1_artifact
          gh run download 34772895471 \
            --repo toyosky/etf-rotation-strategy \
            --name universe-size-stage1-repair-34772895471 \
            --dir stage1_artifact

      - name: Run frozen Stage3 identifiability audit
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/universe_size_then_composition/stage3_conditional_size_direction.py \
            --stage1-artifact-dir stage1_artifact \
            --output-dir stage3-conditional-size-direction-output

      - name: Publish Stage3 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-size-stage3-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            stage3-conditional-size-direction-output/stage3_report.json
            stage3-conditional-size-direction-output/stage3_expanding_predictions.csv
            stage3-conditional-size-direction-output/stage3_monthly_state.csv
