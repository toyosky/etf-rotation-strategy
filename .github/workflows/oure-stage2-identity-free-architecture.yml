name: OURE Stage2 Identity-Free Architecture Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage2_identity_free_architecture.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE2_IDENTITY_FREE_ARCHITECTURE_DESIGN_20260914.md"
      - ".github/workflows/oure-stage2-identity-free-architecture.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements-full-market-ols.txt
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage2_identity_free_architecture.py
      - name: Download frozen OURE Stage1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34805780500 -n oure-stage1-fix15-34805780500 -D oure-stage1-artifact
      - name: Run identity-free architecture audit
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: >-
          python research/optimal_universe_reverse_engineering/oure_stage2_identity_free_architecture.py
          --stage1-dir oure-stage1-artifact
          --output-dir oure-stage2-output
      - name: Upload OURE Stage2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage2-architecture-${{ github.run_id }}
          path: oure-stage2-output/
          retention-days: 90
