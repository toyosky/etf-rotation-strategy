name: Audit Oct20 ETF Rebuild Independence
on:
  push:
    paths:
      - 'research/rebuild_diffusion/oct20_independence_audit.py'
      - '.github/workflows/research-oct20-independence.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-oct20-independence
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Requirements
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "pyarrow>=18"
      - name: Compile
        run: python -m py_compile research/rebuild_diffusion/oct20_independence_audit.py
      - name: Get full-market historical bars
        run: |
          mkdir -p /tmp/fullmarket
          gh release download research-data-fullmarket-current --repo "$GH_REPO" --pattern refreshed_daily_bars.parquet --dir /tmp/fullmarket
          test -s /tmp/fullmarket/refreshed_daily_bars.parquet
      - name: Analyze 40 qualification histories
        run: |
          python -m research.rebuild_diffusion.oct20_independence_audit \
            --parquet /tmp/fullmarket/refreshed_daily_bars.parquet \
            --market data/full-market-rebuild-latest.json \
            --scope data/audit-scope-latest.json \
            --output research/rebuild_diffusion/oct20_independence_results.json
      - name: Commit research-only report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/rebuild_diffusion/oct20_independence_results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: store October 20 ETF independence audit"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oct20-independence-${{ github.run_id }}
          path: research/rebuild_diffusion/oct20_independence_results.json
          if-no-files-found: warn
