name: Universe Oracle V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/universe/oracle_replacement_v1.py'
      - 'research/universe/UNIVERSE_ORACLE_V1.md'
      - '.github/workflows/universe-oracle-v1.yml'

permissions:
  contents: read

concurrency:
  group: universe-oracle-v1
  cancel-in-progress: false

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Run hindsight universe oracle diagnostic
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/universe/oracle_replacement_v1.py \
            --summary-path universe-oracle-v1-summary.json \
            --report-path universe-oracle-v1-report.md
      - name: Publish report
        if: always()
        run: |
          if [ -f universe-oracle-v1-report.md ]; then
            cat universe-oracle-v1-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe-oracle-v1-${{ github.run_id }}
          path: |
            universe-oracle-v1-summary.json
            universe-oracle-v1-report.md
          if-no-files-found: warn
          retention-days: 30
