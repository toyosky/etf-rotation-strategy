name: OURE Stage4F Domain Complementarity

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage4f_domain_complementarity.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE4F_DOMAIN_COMPLEMENTARITY_DESIGN_20260914.md"
      - ".github/workflows/oure-stage4f-domain-complementarity.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements-full-market-ols.txt
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage4f_domain_complementarity.py
      - name: Download Stage3B artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34809905970 -n oure-stage3b-strict-exposure-disjoint-34809905970 -D stage3b-artifact
      - name: Download Stage4C artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34830882472 -n oure-stage4c-two-architecture-34830882472 -D stage4c-artifact
      - name: Download Stage3C artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34828750914 -n oure-stage3c-strict-tech-repair-34828750914 -D stage3c-artifact
      - name: Run Stage4F domain complementarity audit
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: >-
          python research/optimal_universe_reverse_engineering/oure_stage4f_domain_complementarity.py
          --stage3b-dir stage3b-artifact
          --stage4c-dir stage4c-artifact
          --stage3c-dir stage3c-artifact
          --output-dir oure-stage4f-output
      - name: Upload Stage4F artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage4f-domain-complementarity-${{ github.run_id }}
          path: oure-stage4f-output/
          retention-days: 90
