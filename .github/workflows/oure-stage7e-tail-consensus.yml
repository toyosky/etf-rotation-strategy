name: OURE Stage7E Tail Consensus

on:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage7e_tail_consensus.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE7E_TAIL_CONSENSUS_DESIGN_20260915.md"
      - ".github/workflows/oure-stage7e-tail-consensus.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage7e_tail_consensus.py
      - name: Run Stage7E
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage7e_tail_consensus.py \
            --output-dir oure-stage7e-output
      - name: Upload Stage7E artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage7e-tail-consensus-${{ github.run_id }}
          path: oure-stage7e-output/
          retention-days: 90
