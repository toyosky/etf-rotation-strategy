name: Research Subsector Diffusion Pioneer Validation
on:
  workflow_dispatch:
  push:
    branches:
      - research/taxonomy-rebuild-validation-20261112
    paths:
      - 'research/taxonomy_v3/audit_intrasector_diffusion_v1.py'
      - '.github/workflows/research-taxonomy-intrasector-diffusion-v1.yml'
permissions:
  contents: write
concurrency:
  group: research-taxonomy-intrasector-diffusion-v1
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=2,<3' 'pyarrow>=18,<24'
      - name: Static checks and no-lookahead toy test
        run: |
          python -m py_compile research/taxonomy_v3/audit_exact_rebuild_v1.py research/taxonomy_v3/audit_intrasector_diffusion_v1.py
          python research/taxonomy_v3/audit_intrasector_diffusion_v1.py --self-test
      - name: Download source snapshot
        run: |
          mkdir -p /tmp/intrasector
          gh release download research-data-fullmarket-current --repo "$GH_REPO" \
            --pattern refreshed_daily_bars.parquet --dir /tmp/intrasector
          test -s /tmp/intrasector/refreshed_daily_bars.parquet
      - name: Analyze sector diffusion at fixed checkpoints
        run: |
          python research/taxonomy_v3/audit_intrasector_diffusion_v1.py \
            --bars /tmp/intrasector/refreshed_daily_bars.parquet \
            --taxonomy research/taxonomy_v3/output_v32/classifications.parquet \
            --summary research/taxonomy_v3/output_v32/summary.json
      - name: Show result
        if: success()
        run: cat research/taxonomy_v3/output_v32/intrasector_diffusion_v1.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit research outputs only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/taxonomy_v3/output_v32/intrasector_diffusion_v1.md research/taxonomy_v3/output_v32/intrasector_diffusion_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record subsector pioneer diffusion outcomes'
          git pull --rebase origin research/taxonomy-rebuild-validation-20261112
          git push origin HEAD:research/taxonomy-rebuild-validation-20261112
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intrasector-diffusion-${{ github.run_id }}
          path: |
            research/taxonomy_v3/output_v32/intrasector_diffusion_v1.json
            research/taxonomy_v3/output_v32/intrasector_diffusion_v1.md
          if-no-files-found: warn
          retention-days: 30
