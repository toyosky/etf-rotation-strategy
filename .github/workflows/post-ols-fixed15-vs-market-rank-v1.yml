name: Post-OLS Fixed15 vs Market Rank V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/post_ols_life/fixed15_vs_market_rank_v1.py'
      - '.github/workflows/post-ols-fixed15-vs-market-rank-v1.yml'

permissions:
  contents: read

concurrency:
  group: post-ols-fixed15-vs-market-rank-v1
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Run rank-tenure diagnostic
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/post_ols_life/fixed15_vs_market_rank_v1.py \
            --summary-path fixed15-vs-market-rank-summary.json \
            --report-path fixed15-vs-market-rank-report.md
      - name: Publish report
        if: always()
        run: |
          if [ -f fixed15-vs-market-rank-report.md ]; then
            cat fixed15-vs-market-rank-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed15-vs-market-rank-v1-${{ github.run_id }}
          path: |
            fixed15-vs-market-rank-summary.json
            fixed15-vs-market-rank-report.md
          if-no-files-found: warn
          retention-days: 30
