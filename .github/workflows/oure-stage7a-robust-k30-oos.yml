name: OURE Stage7A Robust K30 OOS

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage7a_robust_k30_oos.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE7A_ROBUST_K30_OOS_DESIGN_20260915.md"
      - ".github/workflows/oure-stage7a-robust-k30-oos.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage7a_robust_k30_oos.py
      - name: Run Stage7A
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage7a_robust_k30_oos.py \
            --output-dir oure-stage7a-output
      - name: Upload Stage7A artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage7a-robust-k30-oos-${{ github.run_id }}
          path: oure-stage7a-output
          retention-days: 90
