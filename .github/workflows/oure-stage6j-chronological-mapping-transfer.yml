name: OURE Stage6J Chronological Mapping Transfer

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage6j_chronological_mapping_transfer.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE6J_CHRONOLOGICAL_MAPPING_TRANSFER_DESIGN_20260914.md"
      - ".github/workflows/oure-stage6j-chronological-mapping-transfer.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage6j_chronological_mapping_transfer.py
      - name: Run Stage6J
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage6j_chronological_mapping_transfer.py \
            --output-dir oure-stage6j-output
      - name: Upload Stage6J artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage6j-chronological-mapping-transfer-${{ github.run_id }}
          path: oure-stage6j-output
          retention-days: 90
