name: Research Fixed-14 Rebuild Independent Value
on:
  push:
    branches: [research/fix14-rebuild-20261113]
    paths:
      - 'research/fix14_rebuild/audit.py'
      - '.github/workflows/research-fix14-rebuild.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'pyarrow>=18,<24'
      - name: Fetch and verify historical ETF snapshot
        run: |
          mkdir -p /tmp/etf14
          gh release download research-data-fullmarket-current --repo "$GH_REPO" \
            --pattern refreshed_daily_bars.parquet --dir /tmp/etf14 || true
          expected='9d55f6e0a511be72609e799b19d04c1b44e2555374298bceef102a0481a067fb'
          actual=$(sha256sum /tmp/etf14/refreshed_daily_bars.parquet 2>/dev/null | cut -d' ' -f1 || true)
          if [ "$actual" != "$expected" ]; then
            rm -f /tmp/etf14/refreshed_daily_bars.parquet
            git fetch origin research/taxonomy-v3-evidence-20261112 --depth=1
            git show 8037109205eb36a3514c5f14d8f2f8c2dba3d351:research/taxonomy_v3/archive/taxonomy-v3-evidence-20261112.tar.gz > /tmp/etf14/archive.tar.gz
            tar -xzf /tmp/etf14/archive.tar.gz -C /tmp/etf14
          fi
          echo "$expected  /tmp/etf14/refreshed_daily_bars.parquet" | sha256sum -c -
      - name: Test compilation and run fixed-14 benchmark
        run: |
          python -m py_compile research/fix14_rebuild/audit.py
          python -m research.fix14_rebuild.audit --parquet /tmp/etf14/refreshed_daily_bars.parquet
      - name: Post results to workflow summary
        if: success()
        run: |
          cat research/fix14_rebuild/output/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit research-only summary
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/fix14_rebuild/output/REPORT.md research/fix14_rebuild/output/result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record frozen fixed-14 rebuilding diagnostic'
          git push origin HEAD:research/fix14-rebuild-20261113
      - name: Save auditable event panel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix14-rebuild-${{ github.run_id }}
          path: research/fix14_rebuild/output/
          if-no-files-found: warn
          retention-days: 30
