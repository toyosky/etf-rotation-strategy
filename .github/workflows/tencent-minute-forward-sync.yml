name: Tencent Minute Forward Sync

on:
  push:
    paths:
      - 'automation/tencent_minute_forward_sync.py'
      - 'automation/build_minute_execution_forward.py'
      - '.github/workflows/tencent-minute-forward-sync.yml'
  schedule:
    # 07:20 UTC = 15:20 Asia/Shanghai, after A-share close.
    - cron: '20 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install psycopg2-binary
      - run: python -m py_compile automation/tencent_minute_forward_sync.py automation/build_minute_execution_forward.py
      - run: python automation/tencent_minute_forward_sync.py
      - run: python automation/build_minute_execution_forward.py
      - name: Commit minute live data
        shell: bash
        run: |
          git add data/minute-live.json
          if git diff --cached --quiet; then
            echo "Minute live data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh minute execution forward tracker"
          git push origin HEAD:main
      - name: Publish summary
        if: always()
        run: |
          if [ -f tencent-minute-forward-summary.json ]; then
            echo '## Tencent minute forward sync' >> "$GITHUB_STEP_SUMMARY"
            cat tencent-minute-forward-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f data/minute-live.json ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '## Minute execution model' >> "$GITHUB_STEP_SUMMARY"
            python -c "import json; x=json.load(open('data/minute-live.json',encoding='utf-8')); print(json.dumps({'settled_through':x['settled_through'],'returns':{k:v['settled_return'] for k,v in x['variants'].items()}},ensure_ascii=False,indent=2))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tencent-minute-forward-${{ github.run_id }}
          path: |
            tencent-minute-forward-summary.json
            data/minute-live.json
          if-no-files-found: warn
          retention-days: 30
