name: Research Rebound Exact Uncensored V2
on:
  workflow_dispatch:
  push:
    branches:
      - research/taxonomy-rebuild-validation-20261112
    paths:
      - 'research/taxonomy_v3/audit_drawdown_rebuild_exact_uncensored_v2.py'
      - '.github/workflows/research-drawdown-rebuild-exact-v2.yml'
permissions:
  contents: write
concurrency:
  group: research-drawdown-rebuild-exact-v2
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=2,<3' 'pyarrow>=18,<24'
      - name: Validate source and indexing assumptions
        run: |
          python -m py_compile research/taxonomy_v3/audit_drawdown_rebuild_exact_uncensored_v2.py research/taxonomy_v3/audit_drawdown_rebuild_episode_v1.py
          python research/taxonomy_v3/audit_drawdown_rebuild_exact_uncensored_v2.py --self-test
      - name: Download frozen data and verify integrity downstream
        run: |
          mkdir -p /tmp/etf-rebound-v2
          gh release download research-data-fullmarket-current --repo "$GH_REPO" \
            --pattern refreshed_daily_bars.parquet --dir /tmp/etf-rebound-v2
          test -s /tmp/etf-rebound-v2/refreshed_daily_bars.parquet
      - name: Run episode and right-censor analysis
        run: |
          python research/taxonomy_v3/audit_drawdown_rebuild_exact_uncensored_v2.py \
            --bars /tmp/etf-rebound-v2/refreshed_daily_bars.parquet \
            --taxonomy research/taxonomy_v3/output_v32/classifications.parquet \
            --summary research/taxonomy_v3/output_v32/summary.json
      - name: Publish human-readable report
        if: success()
        run: cat research/taxonomy_v3/output_v32/drawdown_rebuild_exact_uncensored_v2.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit artifacts exclusively to research branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/taxonomy_v3/output_v32/drawdown_rebuild_exact_uncensored_v2.json research/taxonomy_v3/output_v32/drawdown_rebuild_exact_uncensored_v2.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record uncensored exact-index rebuild episodes'
          git pull --rebase origin research/taxonomy-rebuild-validation-20261112
          git push origin HEAD:research/taxonomy-rebuild-validation-20261112
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawdown-rebuild-exact-v2-${{ github.run_id }}
          path: |
            research/taxonomy_v3/output_v32/drawdown_rebuild_exact_uncensored_v2.json
            research/taxonomy_v3/output_v32/drawdown_rebuild_exact_uncensored_v2.md
          if-no-files-found: warn
          retention-days: 30
