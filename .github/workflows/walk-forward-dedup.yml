name: Walk Forward Dedup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/walk_forward_dedup.py'
      - '.github/workflows/walk-forward-dedup.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Run dedup walk-forward test
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/walk_forward_dedup.py --summary-path walk-forward-dedup-summary.json
      - name: Show summary
        run: cat walk-forward-dedup-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: walk-forward-dedup-${{ github.run_id }}
          path: walk-forward-dedup-summary.json
          retention-days: 30
