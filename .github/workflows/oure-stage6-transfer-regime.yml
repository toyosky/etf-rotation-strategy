name: OURE Stage6 Transfer Regime Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage6_transfer_regime.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE6_TRANSFER_REGIME_DESIGN_20260914.md"
      - ".github/workflows/oure-stage6-transfer-regime.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements-full-market-ols.txt
      - name: Syntax check
        env:
          PYTHONPATH: research
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage6_transfer_regime.py
      - name: Run Stage6 transfer regime audit
        env:
          PYTHONPATH: research
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: >-
          python research/optimal_universe_reverse_engineering/oure_stage6_transfer_regime.py
          --output-dir oure-stage6-output
      - name: Upload Stage6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage6-transfer-regime-${{ github.run_id }}
          path: oure-stage6-output/
          retention-days: 90
