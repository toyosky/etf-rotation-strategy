name: Monthly Liquidity Cluster Universe

on:
  push:
    paths:
      - 'research/monthly_liquidity_cluster_universe.py'
      - '.github/workflows/monthly-liquidity-cluster-universe.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Run monthly liquidity cluster universe research
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/monthly_liquidity_cluster_universe.py \
            --summary-path monthly-liquidity-cluster-summary.json \
            --audit-path monthly-liquidity-cluster-audit.csv
      - name: Show summary
        run: |
          cat monthly-liquidity-cluster-summary.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat monthly-liquidity-cluster-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-liquidity-cluster-${{ github.run_id }}
          path: |
            monthly-liquidity-cluster-summary.json
            monthly-liquidity-cluster-audit.csv
          retention-days: 30
