name: Asset Health Monitor

on:
  schedule:
    - cron: "30 0 2 * *"
  workflow_dispatch:
    inputs:
      pushplus_test:
        description: "Send a PushPlus test message even if health status did not change"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: asset-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-asset-health.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-asset-health.txt

      - name: Run unit tests
        run: python -m unittest discover -s research -p 'test_*.py'

      - name: Run Asset Health Monitor for ACTIVE universe
        env:
          SUPABASE_URL: https://rmdfnksgqvewijegnqon.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ASSET_HEALTH_STRATEGY_VERSION: FROZEN_C2@20260903T_fixed_window_v2
        run: |
          python research/asset_health_active.py \
            --summary-path asset-health-summary.md \
            --json-path asset-health-summary.json
          cat asset-health-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Notify meaningful status changes
        env:
          SUPABASE_URL: https://rmdfnksgqvewijegnqon.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ASSET_HEALTH_STRATEGY_VERSION: FROZEN_C2@20260903T_fixed_window_v2
        run: |
          EXTRA_ARGS=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.pushplus_test }}" == "true" ]]; then
            EXTRA_ARGS+=(--test)
          fi
          python research/pushplus_notify.py "${EXTRA_ARGS[@]}"

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: asset-health-${{ github.run_id }}
          path: |
            asset-health-summary.md
            asset-health-summary.json
          retention-days: 30
