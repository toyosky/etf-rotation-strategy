name: Asset Health Monitor

on:
  schedule:
    - cron: "30 0 2 * *"
  workflow_dispatch:
    inputs:
      pushplus_test:
        description: "Send a PushPlus test message even if health status did not change"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: asset-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-asset-health.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-asset-health.txt

      - name: Run unit tests
        run: python -m unittest discover -s research -p 'test_*.py'

      - name: Run Asset Health Monitor for current ACTIVE universe
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/asset_health_repo.py \
            --summary-path asset-health-summary.md \
            --json-path asset-health-summary.json
          cat asset-health-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Notify meaningful status changes
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          EXTRA_ARGS=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.pushplus_test }}" == "true" ]]; then
            EXTRA_ARGS+=(--test)
          fi
          python research/pushplus_notify_file.py \
            --current asset-health-summary.json \
            --previous data/asset-health-latest.json \
            "${EXTRA_ARGS[@]}"

      - name: Persist latest health snapshot
        run: |
          mkdir -p data
          cp asset-health-summary.json data/asset-health-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asset-health-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update Asset Health snapshot [skip ci]"
            git push
          else
            echo "Asset Health snapshot unchanged."
          fi

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: asset-health-${{ github.run_id }}
          path: |
            asset-health-summary.md
            asset-health-summary.json
          retention-days: 30
