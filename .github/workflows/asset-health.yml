name: Asset Health Monitor

on:
  schedule:
    - cron: "30 0 2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-asset-health.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-asset-health.txt

      - name: Run unit tests
        run: python -m unittest research/test_asset_health.py

      - name: Run Asset Health Monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ASSET_HEALTH_STRATEGY_VERSION: FROZEN_C2@20260903T_fixed_window_v2
        run: |
          python research/asset_health.py \
            --summary-path asset-health-summary.md \
            --json-path asset-health-summary.json
          cat asset-health-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: asset-health-${{ github.run_id }}
          path: |
            asset-health-summary.md
            asset-health-summary.json
          retention-days: 30
