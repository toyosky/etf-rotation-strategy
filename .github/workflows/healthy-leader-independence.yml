name: Healthy Leader Independence Diagnostic

on:
  push:
    paths:
      - 'research/healthy_leader_independence_diagnostic.py'
      - '.github/workflows/healthy-leader-independence.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Run independence diagnostic
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/healthy_leader_independence_diagnostic.py \
            --summary-path healthy-leader-independence-summary.json \
            --events-path healthy-leader-independence-events.csv
      - name: Show summary
        run: |
          cat healthy-leader-independence-summary.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat healthy-leader-independence-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: healthy-leader-independence-${{ github.run_id }}
          path: |
            healthy-leader-independence-summary.json
            healthy-leader-independence-events.csv
          retention-days: 30
