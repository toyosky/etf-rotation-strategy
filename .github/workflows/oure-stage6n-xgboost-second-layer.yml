name: OURE Stage6N XGBoost Second Layer

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage6n_xgboost_second_layer.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE6N_XGBOOST_SECOND_LAYER_DESIGN_20260915.md"
      - ".github/workflows/oure-stage6n-xgboost-second-layer.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn xgboost boto3
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage6n_xgboost_second_layer.py
      - name: Run Stage6N
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage6n_xgboost_second_layer.py \
            --output-dir oure-stage6n-output
      - name: Upload Stage6N artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage6n-xgboost-second-layer-${{ github.run_id }}
          path: oure-stage6n-output
          retention-days: 90
