name: OURE Stage6H Point-in-Time State Gate

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage6h_point_in_time_state_gate.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE6H_POINT_IN_TIME_STATE_GATE_DESIGN_20260914.md"
      - ".github/workflows/oure-stage6h-point-in-time-state-gate.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements-full-market-ols.txt
      - name: Syntax check
        env:
          PYTHONPATH: research
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage6h_point_in_time_state_gate.py
      - name: Run Stage6H point-in-time state gate
        env:
          PYTHONPATH: research
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: >-
          python research/optimal_universe_reverse_engineering/oure_stage6h_point_in_time_state_gate.py
          --output-dir oure-stage6h-output
      - name: Upload Stage6H artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage6h-point-in-time-state-gate-${{ github.run_id }}
          path: oure-stage6h-output/
          retention-days: 90
