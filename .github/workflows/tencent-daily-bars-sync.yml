name: Tencent HFQ Daily Bars Sync

on:
  push:
    paths:
      - 'automation/tencent_daily_sync.py'
      - 'automation/backtest_brazil_rebuild.py'
      - 'automation/build_fundamental_audit_trigger.py'
      - 'research/rebuild_pyramiding_backtest.py'
      - 'automation/tencent_daily_universe.csv'
      - 'automation/test_tencent_daily_sync.py'
      - 'automation/requirements-tencent-daily.txt'
      - 'automation/build_state_map.py'
      - 'automation/build_live_forward.py'
      - '.github/workflows/tencent-daily-bars-sync.yml'
  schedule:
    # 07:30 UTC = 15:30 Asia/Shanghai. GitHub cron is best-effort and may be delayed.
    - cron: "30 7 * * *"
    # Recovery pass at 16:15 CST if first run failed or provider published late.
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Calendar days to refetch and upsert
        required: false
        default: "14"

permissions:
  contents: write

concurrency:
  group: tencent-hfq-daily-bars-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
      PYTHONPATH: research

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements-tencent-daily.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --requirement automation/requirements-tencent-daily.txt
          python -m pip install tabulate scipy
      - name: Run unit checks
        run: python -m unittest discover -s automation -p "test_tencent_daily_sync.py"
      - name: Fetch Tencent HFQ bars and upsert Supabase
        run: |
          for attempt in 1 2 3; do
            if python automation/tencent_daily_sync.py --lookback-days "$LOOKBACK_DAYS" --summary tencent-daily-sync-summary.json; then
              echo "Daily sync succeeded (attempt $attempt)."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Daily sync failed (attempt $attempt/3); retrying after 120 seconds."
              sleep 120
            fi
          done
          echo "::error::Daily sync failed after three attempts."
          exit 1
      - name: Backtest Brazil ETF OLS and R2 rebuild signals
        run: python -m automation.backtest_brazil_rebuild
      - name: Backtest staged R2 rebuild sizing
        run: python research/rebuild_pyramiding_backtest.py
      - name: Rebuild market state map data
        run: python automation/build_state_map.py
      - name: Rebuild frozen strategy live tracker
        run: python automation/build_live_forward.py
      - name: Commit refreshed site data
        shell: bash
        run: |
          if git diff --quiet -- data/state-map-latest.json data/state-map-history.json data/live-forward.json data/brazil-trend-research.json data/rebuild-pyramiding-backtest.json data/rebuild-pyramiding-backtest.json; then
            echo "Site data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state-map-latest.json data/state-map-history.json data/live-forward.json data/brazil-trend-research.json
          git commit -m "data: refresh daily market state and live strategy"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [ -f tencent-daily-sync-summary.json ]; then
            echo '## Tencent HFQ daily sync' >> "$GITHUB_STEP_SUMMARY"
            cat tencent-daily-sync-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f data/state-map-latest.json ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '## Market state map' >> "$GITHUB_STEP_SUMMARY"
            cat data/state-map-latest.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f data/live-forward.json ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '## Live forward strategy' >> "$GITHUB_STEP_SUMMARY"
            python -c "import json; x=json.load(open('data/live-forward.json',encoding='utf-8')); print(json.dumps({'latest':x['latest'],'summary':x['summary']},ensure_ascii=False,indent=2))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tencent-daily-sync-${{ github.run_id }}
          path: |
            tencent-daily-sync-summary.json
            data/state-map-latest.json
            data/live-forward.json
            data/brazil-trend-research.json
            data/rebuild-pyramiding-backtest.json
          if-no-files-found: warn
          retention-days: 30
