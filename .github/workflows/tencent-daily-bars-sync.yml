name: Tencent HFQ Daily Bars Sync

on:
  schedule:
    # 15:30 UTC = 23:30 Asia/Shanghai. Runs every calendar day.
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Calendar days to refetch and upsert
        required: false
        default: "14"

permissions:
  contents: write

concurrency:
  group: tencent-hfq-daily-bars-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements-tencent-daily.txt
      - name: Install pinned Python dependency
        run: python -m pip install --requirement automation/requirements-tencent-daily.txt
      - name: Run unit checks
        run: python -m unittest discover -s automation -p "test_tencent_daily_sync.py"
      - name: Fetch Tencent HFQ bars and upsert Supabase
        run: |
          python automation/tencent_daily_sync.py \
            --lookback-days "$LOOKBACK_DAYS" \
            --summary tencent-daily-sync-summary.json
      - name: Rebuild market state map data
        run: python automation/build_state_map.py
      - name: Commit refreshed state map JSON
        shell: bash
        run: |
          if git diff --quiet -- data/state-map-latest.json data/state-map-history.json; then
            echo "State map data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state-map-latest.json data/state-map-history.json
          git commit -m "data: refresh daily market state map"
          git push origin HEAD:main
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [ -f tencent-daily-sync-summary.json ]; then
            echo '## Tencent HFQ daily sync' >> "$GITHUB_STEP_SUMMARY"
            cat tencent-daily-sync-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f data/state-map-latest.json ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '## Market state map' >> "$GITHUB_STEP_SUMMARY"
            cat data/state-map-latest.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tencent-daily-sync-${{ github.run_id }}
          path: |
            tencent-daily-sync-summary.json
            data/state-map-latest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Notify PushPlus on failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "PUSHPLUS_TOKEN is not configured; skipping PushPlus alert."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          repo = os.environ.get("GITHUB_REPOSITORY", "unknown")
          run_id = os.environ.get("GITHUB_RUN_ID", "unknown")
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"
          when = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          payload = {
              "token": os.environ["PUSHPLUS_TOKEN"],
              "title": "ETF日线/状态图同步失败",
              "content": f"Tencent HFQ Daily Bars Sync / State Map 失败。仓库: {repo}；时间: {when}；Run: {run_url}",
              "template": "txt",
          }
          with open("pushplus-failure.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 \
            -H 'Content-Type: application/json' \
            --data-binary @pushplus-failure.json \
            https://www.pushplus.plus/send
