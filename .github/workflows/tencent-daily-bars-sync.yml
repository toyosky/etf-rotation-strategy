name: One-off Global Base History

on:
  push:
    branches:
      - research/combined-base-ols-20260930
    paths:
      - '.github/workflows/tencent-daily-bars-sync.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install data packages
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance

      - name: Download global ETF and 511220 history
        shell: bash
        run: |
          python - <<'PY'
          import time
          import pandas as pd
          import yfinance as yf

          tickers = ['SPY','DAX','EWJ','EWZ','GLD','CNY=X','511220.SS']
          frames = {}
          for t in tickers:
              last = None
              for attempt in range(4):
                  try:
                      x = yf.download(
                          t,
                          start='2020-08-01',
                          end='2026-10-01',
                          auto_adjust=True,
                          progress=False,
                          threads=False,
                      )
                      if isinstance(x.columns, pd.MultiIndex):
                          x.columns = x.columns.get_level_values(0)
                      min_rows = 500
                      if len(x) < min_rows:
                          raise RuntimeError(f'{t}: only {len(x)} rows')
                      x = x[['Open','Close']].copy()
                      x.index = pd.to_datetime(x.index).tz_localize(None)
                      frames[t] = x
                      print(t, len(x), x.index.min(), x.index.max())
                      break
                  except Exception as e:
                      last=e
                      time.sleep(2**attempt)
              else:
                  raise RuntimeError(f'failed {t}: {last}')

          fx = frames['CNY=X'].rename(columns={'Open':'fx_open','Close':'fx_close'})
          out=[]
          for t in ['SPY','DAX','EWJ','EWZ','GLD']:
              x=frames[t].join(fx,how='inner').dropna()
              z=pd.DataFrame({
                  'date':x.index,
                  'symbol':t,
                  'open':x['Open'].astype(float)*x['fx_open'].astype(float),
                  'close':x['Close'].astype(float)*x['fx_close'].astype(float),
              })
              out.append(z.reset_index(drop=True))
          c=frames['511220.SS'].dropna().copy()
          z=pd.DataFrame({
              'date':c.index,
              'symbol':'511220',
              'open':c['Open'].astype(float),
              'close':c['Close'].astype(float),
          })
          out.append(z.reset_index(drop=True))
          result=pd.concat(out,ignore_index=True).sort_values(['date','symbol'])
          result.to_csv('base-assets-rmb-daily.csv',index=False)
          print(result.groupby('symbol').agg(rows=('date','size'),start=('date','min'),end=('date','max')))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: combined-base-history-${{ github.run_id }}
          path: base-assets-rmb-daily.csv
          retention-days: 3
