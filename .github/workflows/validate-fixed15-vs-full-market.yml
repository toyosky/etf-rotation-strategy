name: Validate Fixed15 vs Full Market

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/validate_fixed15_vs_full_market.py'
      - '.github/workflows/validate-fixed15-vs-full-market.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Run validation
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/validate_fixed15_vs_full_market.py --summary-path fixed15-vs-full-market-summary.json
      - name: Show summary
        run: cat fixed15-vs-full-market-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: fixed15-vs-full-market-${{ github.run_id }}
          path: fixed15-vs-full-market-summary.json
          retention-days: 30
