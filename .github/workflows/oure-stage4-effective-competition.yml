name: OURE Stage4 Effective Competition Decomposition

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage4_effective_competition.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE4_EFFECTIVE_COMPETITION_DECOMPOSITION_DESIGN_20260914.md"
      - ".github/workflows/oure-stage4-effective-competition.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements-full-market-ols.txt
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage4_effective_competition.py
      - name: Download frozen Stage1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34805780500 -n oure-stage1-fix15-34805780500 -D stage1-artifact
      - name: Download Stage3B explanatory artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34809905970 -n oure-stage3b-strict-exposure-disjoint-34809905970 -D stage3b-artifact
      - name: Run effective competition decomposition
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: >-
          python research/optimal_universe_reverse_engineering/oure_stage4_effective_competition.py
          --stage1-dir stage1-artifact
          --stage3b-dir stage3b-artifact
          --output-dir oure-stage4-output
      - name: Upload Stage4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage4-effective-competition-${{ github.run_id }}
          path: oure-stage4-output/
          retention-days: 90
