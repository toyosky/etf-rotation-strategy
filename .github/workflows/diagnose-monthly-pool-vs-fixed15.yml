name: Diagnose Monthly Pool vs Fixed15

on:
  push:
    paths:
      - 'research/diagnose_monthly_pool_vs_fixed15.py'
      - '.github/workflows/diagnose-monthly-pool-vs-fixed15.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Run attribution diagnostic
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/diagnose_monthly_pool_vs_fixed15.py \
            --summary-path monthly-pool-vs-fixed15-diagnostic.json \
            --daily-path monthly-pool-vs-fixed15-daily.csv
      - name: Show summary
        run: |
          cat monthly-pool-vs-fixed15-diagnostic.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat monthly-pool-vs-fixed15-diagnostic.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-pool-vs-fixed15-${{ github.run_id }}
          path: |
            monthly-pool-vs-fixed15-diagnostic.json
            monthly-pool-vs-fixed15-daily.csv
          retention-days: 30
