name: Stock Full-Market V1 Smoke
on:
  push:
    branches:
      - research/stock-value-pilot-20261028
    paths:
      - '.github/workflows/stock-full-market-v1-smoke.yml'
      - 'research/stock_value/full_market_v1/run.py'
permissions:
  contents: read
concurrency:
  group: stock-full-market-v1-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow
      - name: Probe Westock price adjustment and batch schemas
        run: |
          python - <<'PY'
          import json,subprocess
          for fq in ('bfq','qfq'):
            for codes in ('sz002353','sz002353,sz300308'):
              cmd=['npx','-y','westock-data-skillhub@1.0.5','kline',codes,'--period','day','--start','2026-08-01','--end','2026-10-28','--fq',fq,'--raw']
              p=subprocess.run(cmd,text=True,capture_output=True,timeout=90)
              try:
                data=json.loads(p.stdout)
                rows=data.get('data',[]) if isinstance(data,dict) else data
                print('KLINE_PROBE',json.dumps({'fq':fq,'codes':codes,'returncode':p.returncode,'type':type(data).__name__,'rows':len(rows) if isinstance(rows,list) else None,'first':str(rows[0])[:350] if isinstance(rows,list) and rows else None,'stderr':p.stderr[-250:]},ensure_ascii=False),flush=True)
              except Exception as e:
                print('KLINE_PROBE_ERROR',fq,codes,str(e),p.stdout[-250:],p.stderr[-250:],flush=True)
          PY
      - name: Diagnose qfq short-window and target-code behavior
        run: |
          python - <<'PY'
          import json,subprocess
          tests=[
            ("sz000001,sh600519","2026-10-20","2026-10-28"),
            ("sz000001,sh600519","2026-08-01","2026-10-28"),
            ("sh600519,sz000001","2026-10-20","2026-10-28"),
            ("sh600519,sz000001","2026-08-01","2026-10-28"),
            ("sz002353,sz300308","2026-10-20","2026-10-28"),
            ("sz002353,sz300308","2026-08-01","2026-10-28"),
            ("sz000001,sz002353","2026-08-01","2026-10-28"),
            ("sh600519,sz002353","2026-03-01","2026-10-28"),
          ]
          for codes,start,end in tests:
            cmd=['npx','-y','westock-data-skillhub@1.0.5','kline',codes,'--period','day','--start',start,'--end',end,'--fq','qfq','--raw']
            try:
              p=subprocess.run(cmd,text=True,capture_output=True,timeout=60)
              data=json.loads(p.stdout)
              rows=data.get('data',[]) if isinstance(data,dict) else data
              print('KLINE_DIAG',json.dumps({'codes':codes,'start':start,'rc':p.returncode,'shape':type(data).__name__,'keys':list(data)[:8] if isinstance(data,dict) else [],'rows':len(rows) if isinstance(rows,list) else -1,'first':str(rows[0])[:350] if isinstance(rows,list) and rows else None,'stderr':p.stderr[-200:]},ensure_ascii=False),flush=True)
            except Exception as e:print('KLINE_DIAG_ERROR',codes,start,str(e),flush=True)
          PY
      - name: Run 7-stock segmented smoke
        run: python research/stock_value/full_market_v1/run.py --as-of 2026-10-28 --max-symbols 7 --workers 2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-full-market-v1-smoke-${{ github.run_id }}
          path: |
            research/stock_value/full_market_v1/output/**
            research/stock_value/results/full-market-v1-latest.json
          if-no-files-found: warn
          retention-days: 7
