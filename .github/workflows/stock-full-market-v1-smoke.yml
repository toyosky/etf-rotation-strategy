name: Stock Full-Market V1 Smoke
on:
  push:
    branches:
      - research/stock-value-pilot-20261028
    paths:
      - '.github/workflows/stock-full-market-v1-smoke.yml'
permissions:
  contents: read
concurrency:
  group: stock-full-market-v1-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow
      - name: Probe historical data providers
        shell: bash
        run: |
          python - <<'PY'
          import runpy
          m = runpy.run_path('research/stock_value/scan_pilot.py')
          tests = [
              ('Tencent direct 2024-2026', m['tencent_direct'], '2024-07-01'),
              ('Tencent direct 2026', m['tencent_direct'], '2026-08-01'),
              ('Westock 2024-2026', m['westock'], '2024-07-01'),
              ('Westock 2026', m['westock'], '2026-08-01'),
          ]
          ok = 0
          for name, fn, start in tests:
              try:
                  rows = fn('002353', start, '2026-10-28')
                  print('PROVIDER_PROBE', name, 'rows=', len(rows),
                        'first=', rows[0][0] if rows else None,
                        'last=', rows[-1][0] if rows else None, flush=True)
                  ok += bool(rows)
              except Exception as exc:
                  print('PROVIDER_PROBE_ERROR', name, str(exc)[:300], flush=True)
          if not ok:
              raise SystemExit('No historical price provider returned any rows')
          PY
      - name: Run 120-stock smoke
        run: python research/stock_value/full_market_v1/run.py --as-of 2026-10-28 --max-symbols 120
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-full-market-v1-smoke-${{ github.run_id }}
          path: |
            research/stock_value/full_market_v1/output/**
            research/stock_value/results/full-market-v1-latest.json
          if-no-files-found: warn
          retention-days: 7
