name: Cluster90 Resistance Score V1

on:
  push:
    paths:
      - 'research/cluster90_resistance_score_v1_test.py'
      - '.github/workflows/cluster90-resistance-score-v1.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Run Cluster90 Resistance + ScoreDelta V1
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/cluster90_resistance_score_v1_test.py \
            --summary-path cluster90-resistance-score-v1-summary.json \
            --daily-path cluster90-resistance-score-v1-daily.csv \
            --events-path cluster90-resistance-score-v1-events.csv
      - name: Show summary
        run: |
          cat cluster90-resistance-score-v1-summary.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat cluster90-resistance-score-v1-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cluster90-resistance-score-v1-${{ github.run_id }}
          path: |
            cluster90-resistance-score-v1-summary.json
            cluster90-resistance-score-v1-daily.csv
            cluster90-resistance-score-v1-events.csv
          retention-days: 30
