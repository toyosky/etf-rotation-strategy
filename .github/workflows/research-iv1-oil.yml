name: Research IV1 Oil Q90 Calibration
on:
  push:
    branches: [research/top1-downside-20261120]
    paths: ['.github/workflows/research-iv1-oil.yml', 'research/top1_downside/code/iv1_oil_q90_calibration.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iv1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: python research/top1_downside/code/iv1_oil_q90_calibration.py
      - uses: actions/upload-artifact@v7
        with:
          name: iv1-oil-q90
          path: |
            iv1_oil_results.json
            iv1_ovx_source.csv
          if-no-files-found: error
          retention-days: 30
