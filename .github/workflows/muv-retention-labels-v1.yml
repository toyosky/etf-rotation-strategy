name: MUV Retention Labels V1

on:
  workflow_dispatch:
  push:
    paths:
      - "research/marginal_universe_value/build_retention_labels_v1.py"
      - "research/marginal_universe_value/build_retention_labels_v1_1.py"
      - "research/marginal_universe_value/analyze_retention_stage1.py"
      - ".github/workflows/muv-retention-labels-v1.yml"

permissions:
  contents: read

concurrency:
  group: muv-retention-labels-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Build retention counterfactual labels
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          SUPABASE_STORAGE_S3_ENDPOINT: https://gsyziuzezmmnvgdoazkg.storage.supabase.co/storage/v1/s3
          SUPABASE_STORAGE_S3_REGION: ap-southeast-1
          SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
          SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_STORAGE_BUCKET: etf-research-archive
        run: python research/marginal_universe_value/build_retention_labels_v1_1.py

      - name: Analyze retention Stage 1
        run: python research/marginal_universe_value/analyze_retention_stage1.py

      - name: Show summary
        if: always()
        run: |
          if [ -f muv-retention-v1-summary.json ]; then
            cat muv-retention-v1-summary.json
            echo '## Label build' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat muv-retention-v1-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f muv-retention-stage1-report.json ]; then
            echo '## Stage 1 descriptive economics' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('muv-retention-stage1-report.json', encoding='utf-8'))
          print('```json')
          print(json.dumps({
              'dataset': r['dataset'],
              'target_decomposition': r['target_decomposition'],
              'feature_group_summary': r['feature_group_summary'],
              'top_stable_impact_features': r['top_stable_impact_features'][:8],
              'top_stable_conditional_value_features': r['top_stable_conditional_value_features'][:8],
          }, ensure_ascii=False, indent=2))
          print('```')
          PY
          fi

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muv-retention-labels-v1-${{ github.run_id }}
          path: |
            muv-retention-v1-summary.json
            muv-retention-labels-v1.parquet
            muv-retention-stage1-report.json
            muv-retention-stage1-features.csv
            muv-retention-stage1-symbols.csv
            muv-retention-stage1-quantiles.csv
          if-no-files-found: ignore
          retention-days: 30
