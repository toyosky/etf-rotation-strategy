name: MUV Retention Labels V1

on:
  workflow_dispatch:
  push:
    paths:
      - "research/requirements-full-market-ols.txt"
      - "research/marginal_universe_value/build_retention_labels_v1.py"
      - "research/marginal_universe_value/build_retention_labels_v1_1.py"
      - "research/marginal_universe_value/build_retention_labels_v1_2.py"
      - "research/marginal_universe_value/build_retention_labels_v1_3.py"
      - "research/marginal_universe_value/build_retention_labels_v1_4.py"
      - "research/marginal_universe_value/model_retention_stage3_pairwise_sign.py"
      - "research/marginal_universe_value/model_retention_stage4_regime_robustness.py"
      - "research/marginal_universe_value/model_retention_stage5_regime_diagnostics.py"
      - "research/marginal_universe_value/model_retention_stage6_policy_walkforward.py"
      - "research/marginal_universe_value/model_retention_stage7_asymmetric_safety.py"
      - "research/marginal_universe_value/model_retention_stage8_robustness.py"
      - "research/marginal_universe_value/model_retention_stage9_second_removal_oracle.py"
      - "research/marginal_universe_value/model_retention_stage10_dynamic_second.py"
      - "research/marginal_universe_value/build_retention_stage11_conditional_second_labels.py"
      - "research/marginal_universe_value/model_retention_stage12_tail_winner_guard.py"
      - ".github/workflows/muv-retention-labels-v1.yml"

permissions:
  contents: read

concurrency:
  group: muv-retention-labels-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Build retention V1.4 regime labels
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          SUPABASE_STORAGE_S3_ENDPOINT: https://gsyziuzezmmnvgdoazkg.storage.supabase.co/storage/v1/s3
          SUPABASE_STORAGE_S3_REGION: ap-southeast-1
          SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
          SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_STORAGE_BUCKET: etf-research-archive
        run: python research/marginal_universe_value/build_retention_labels_v1_4.py

      - name: Stage 3 pairwise sign walk-forward
        run: python research/marginal_universe_value/model_retention_stage3_pairwise_sign.py

      - name: Stage 4 regime robustness
        run: python research/marginal_universe_value/model_retention_stage4_regime_robustness.py

      - name: Stage 5 regime diagnostics
        run: python research/marginal_universe_value/model_retention_stage5_regime_diagnostics.py

      - name: Stage 6 one-step retention policy walk-forward
        run: python research/marginal_universe_value/model_retention_stage6_policy_walkforward.py

      - name: Stage 7 asymmetric retention safety walk-forward
        run: python research/marginal_universe_value/model_retention_stage7_asymmetric_safety.py

      - name: Stage 8 fixed-policy robustness diagnostics
        run: python research/marginal_universe_value/model_retention_stage8_robustness.py

      - name: Stage 9 second-removal Oracle headroom audit
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/marginal_universe_value/model_retention_stage9_second_removal_oracle.py

      - name: Stage 10 dynamic second-removal transport test
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/marginal_universe_value/model_retention_stage10_dynamic_second.py

      - name: Stage 11 conditional second-order label diagnostics
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/marginal_universe_value/build_retention_stage11_conditional_second_labels.py

      - name: Stage 12 direct tail-winner guard
        run: python research/marginal_universe_value/model_retention_stage12_tail_winner_guard.py

      - name: Show summary
        if: always()
        run: |
          for f in \
            muv-retention-v1-summary.json \
            muv-retention-stage3-report.json \
            muv-retention-stage4-report.json \
            muv-retention-stage5-report.json \
            muv-retention-stage6-report.json \
            muv-retention-stage7-report.json \
            muv-retention-stage8-report.json \
            muv-retention-stage9-report.json \
            muv-retention-stage10-report.json \
            muv-retention-stage11-report.json \
            muv-retention-stage12-report.json; do
            if [ -f "$f" ]; then
              echo "## $f" >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muv-retention-v1_4-stage12-${{ github.run_id }}
          path: |
            muv-retention-v1-summary.json
            muv-retention-labels-v1.parquet
            muv-retention-stage3-report.json
            muv-retention-stage3-predictions.csv
            muv-retention-stage4-report.json
            muv-retention-stage4-predictions.csv
            muv-retention-stage5-report.json
            muv-retention-stage5-monthly-regimes.csv
            muv-retention-stage5-terciles.csv
            muv-retention-stage6-report.json
            muv-retention-stage6-monthly-policy.csv
            muv-retention-stage7-report.json
            muv-retention-stage7-monthly-policy.csv
            muv-retention-stage7-safety-predictions.csv
            muv-retention-stage8-report.json
            muv-retention-stage9-report.json
            muv-retention-stage9-second-removal-oracle.csv
            muv-retention-stage10-report.json
            muv-retention-stage10-dynamic-second.csv
            muv-retention-stage11-report.json
            muv-retention-stage11-conditional-second.parquet
            muv-retention-stage11-stage7-slice.csv
            muv-retention-stage12-report.json
            muv-retention-stage12-tail-predictions.csv
            muv-retention-stage12-stage7-guard.csv
            muv-retention-stage12-stage10-guard.csv
          if-no-files-found: ignore
          retention-days: 30
