name: Test WeStock Kline

on:
  push:
    paths:
      - '.github/workflows/test-westock-kline.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Show Node and npm versions
        run: |
          node --version
          npm --version
      - name: Compare adjustment modes
        shell: bash
        run: |
          set -euo pipefail
          for fq in bfq qfq hfq; do
            echo "===== FQ=$fq ====="
            npx -y westock-data-skillhub@1.0.5 kline sh510300,sz161226,sh501018 \
              --start 2026-09-08 --end 2026-09-08 --period day --fq "$fq" --raw \
              | tee "westock-$fq.json"
          done
      - name: Upload raw outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: westock-fq-compare-${{ github.run_id }}
          path: westock-*.json
          if-no-files-found: warn
          retention-days: 7
