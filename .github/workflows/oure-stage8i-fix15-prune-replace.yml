name: OURE Stage8I Fix15 Prune Replace

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research/optimal_universe_reverse_engineering/oure_stage8i_fix15_prune_replace.py'
      - '.github/workflows/oure-stage8i-fix15-prune-replace.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q numpy pandas sqlalchemy psycopg2-binary boto3 scikit-learn
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage8i_fix15_prune_replace.py
      - name: Run Stage8I
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/optimal_universe_reverse_engineering/oure_stage8i_fix15_prune_replace.py --output-dir oure-stage8i-output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage8i-fix15-prune-replace-${{ github.run_id }}
          path: oure-stage8i-output/
          retention-days: 90
