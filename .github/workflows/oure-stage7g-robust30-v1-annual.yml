name: OURE Stage7G Robust30 V1 Annual

on:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage7g_robust30_v1_annual.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE7G_ROBUST30_V1_ANNUAL_DESIGN_20260915.md"
      - ".github/workflows/oure-stage7g-robust30-v1-annual.yml"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3 pyarrow
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage7g_robust30_v1_annual.py
      - name: Run Stage7G
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage7g_robust30_v1_annual.py \
            --output-dir oure-stage7g-output
      - name: Upload Stage7G artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage7g-robust30-v1-annual-${{ github.run_id }}
          path: oure-stage7g-output/
          retention-days: 90
