name: Build Instrument Metadata

# Rebuild metadata after Tencent daily_bars refresh, then apply the stable V2
# economic-exposure taxonomy so a rebuild cannot regress to coarse AUTO_NAME_V1.
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/build_instrument_metadata.py'
      - 'research/build_instrument_metadata_static.py'
      - 'research/build_instrument_metadata_universe_v2.py'
      - 'research/build_instrument_metadata_universe_v3.py'
      - 'research/build_instrument_metadata_universe_v4.py'
      - 'research/apply_instrument_taxonomy_v2.py'
      - 'research/apply_instrument_taxonomy_v2_fixes.py'
      - 'research/requirements-instrument-metadata.txt'
      - '.github/workflows/build-instrument-metadata.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-instrument-metadata.txt
      - run: python -m pip install --requirement research/requirements-instrument-metadata.txt
      - name: Build and persist first-pass metadata
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/build_instrument_metadata_universe_v4.py \
            --summary-path instrument-metadata-summary.json \
            --csv-path instrument-metadata-current.csv \
            --review-path instrument-metadata-review.csv
      - name: Apply taxonomy V2
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/apply_instrument_taxonomy_v2.py
          python research/apply_instrument_taxonomy_v2_fixes.py
      - name: Show first-pass summary
        run: |
          cat instrument-metadata-summary.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat instrument-metadata-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: instrument-metadata-${{ github.run_id }}
          path: |
            instrument-metadata-summary.json
            instrument-metadata-current.csv
            instrument-metadata-review.csv
          retention-days: 30
