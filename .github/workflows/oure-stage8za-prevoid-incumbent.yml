name: OURE Stage8ZA PreVoid Incumbent

on:
  push:
    branches: [ main ]
    paths:
      - 'research/optimal_universe_reverse_engineering/oure_stage8za_prevoid_incumbent_full_backtest.py'
      - '.github/workflows/oure-stage8za-prevoid-incumbent.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
      PYTHONPATH: research
      OUTPUT_DIR: stage8za-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas sqlalchemy psycopg2-binary boto3 tabulate scipy
      - run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage8za_prevoid_incumbent_full_backtest.py
      - run: python research/optimal_universe_reverse_engineering/oure_stage8za_prevoid_incumbent_full_backtest.py
      - run: if [ -f "$OUTPUT_DIR/stage8za_summary.md" ]; then cat "$OUTPUT_DIR/stage8za_summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: oure-stage8za-${{ github.run_id }}
          path: stage8za-output/
          retention-days: 30
