name: MUV Stage23 Coverage-to-Score Bridge Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "research/requirements-full-market-ols.txt"
      - "research/full_market_ols_storage.py"
      - "research/validate_fixed15_vs_full_market.py"
      - "research/marginal_universe_value/model_stage23_coverage_to_score_bridge.py"
      - "research/marginal_universe_value/STAGE23_COVERAGE_TO_SCORE_BRIDGE_DESIGN_20260913.md"
      - "research/marginal_universe_value/experiment_registry.yaml"
      - ".github/actions/muv-publish/action.yml"
      - ".github/workflows/muv-stage23-coverage-to-score-bridge.yml"

permissions:
  contents: read

concurrency:
  group: muv-stage23-coverage-to-score-bridge
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Run Stage23 coverage-to-score bridge audit
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/marginal_universe_value/model_stage23_coverage_to_score_bridge.py

      - name: Publish Stage23 outputs
        if: always()
        uses: ./.github/actions/muv-publish
        with:
          report-file: muv-stage23-coverage-to-score-bridge-report.json
          artifact-name: muv-stage23-coverage-to-score-bridge-${{ github.run_id }}
          paths: |
            muv-stage23-coverage-to-score-bridge-report.json
            muv-stage23-coverage-to-score-bridge-events.csv
