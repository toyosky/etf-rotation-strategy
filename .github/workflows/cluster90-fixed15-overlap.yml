name: Cluster90 Fixed15 Overlap

on:
  push:
    paths:
      - 'research/cluster90_fixed15_overlap.py'
      - '.github/workflows/cluster90-fixed15-overlap.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Run overlap diagnostic
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/cluster90_fixed15_overlap.py \
            --summary-path cluster90-fixed15-overlap-summary.json \
            --daily-path cluster90-fixed15-overlap-daily.csv \
            --symbol-path cluster90-fixed15-overlap-symbol.csv
      - name: Show summary
        run: |
          cat cluster90-fixed15-overlap-summary.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat cluster90-fixed15-overlap-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cluster90-fixed15-overlap-${{ github.run_id }}
          path: |
            cluster90-fixed15-overlap-summary.json
            cluster90-fixed15-overlap-daily.csv
            cluster90-fixed15-overlap-symbol.csv
          retention-days: 30
