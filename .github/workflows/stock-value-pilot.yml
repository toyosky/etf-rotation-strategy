name: A-share Value Drawdown Pilot
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Last trading day to screen (YYYY-MM-DD)'
        required: false
        default: '2026-10-28'
permissions:
  contents: write
concurrency:
  group: stock-value-pilot
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and screen 7 stocks
        run: python research/stock_value/scan_pilot.py --as-of "${{ inputs.as_of || '2026-10-28' }}"
      - name: Commit only pilot archives and latest result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stock_value/data/daily/*.csv.gz research/stock_value/results/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh 7-stock value drawdown pilot"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
