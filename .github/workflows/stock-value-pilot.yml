name: A-share Value Drawdown Pilot
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Last trading day to screen (YYYY-MM-DD)'
        required: false
        default: '2026-10-28'
permissions:
  contents: write
concurrency:
  group: stock-value-pilot
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and screen 7 stocks
        id: scan
        run: python research/stock_value/scan_pilot.py --as-of "${{ inputs.as_of || '2026-10-28' }}"
      - name: Capture unverified financial source snapshots
        if: always()
        continue-on-error: true
        run: python research/stock_value/fetch_financials.py
      - name: Normalize publication-date-safe profit and cash flow
        if: always()
        continue-on-error: true
        run: python research/stock_value/normalize_financials.py --as-of "${{ inputs.as_of || '2026-10-28' }}"
      - name: Cross-check published financials and finalize pilot acceptance
        if: always()
        run: python research/stock_value/validate_financials.py
      - name: Install OLS test dependency
        run: python -m pip install numpy
      - name: Test frozen OLS rebuilding on pilot stocks
        if: always()
        continue-on-error: true
        run: python research/stock_value/test_rebuild_signals.py
      - name: Upload diagnostic results even if fetch failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-value-pilot-diagnostics
          path: |
            research/stock_value/results/latest.json
            research/stock_value/results/financial-source-status.json
            research/stock_value/results/financial-summary.json
            research/stock_value/results/rebuild-signals.json
            research/stock_value/results/financial-validation.json
            research/stock_value/data/finance/*.json.gz
            research/stock_value/data/daily/*.csv.gz
          if-no-files-found: warn
          retention-days: 14
      - name: Commit pilot archives and diagnostic results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- research/stock_value
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh 7-stock value drawdown pilot"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
