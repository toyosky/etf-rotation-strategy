name: Premium History Sync

on:
  push:
    paths:
      - 'automation/premium_history_sync.py'
      - 'automation/requirements-premium-history.txt'
      - '.github/workflows/premium-history-sync.yml'
  schedule:
    # 01:20 UTC = 09:20 Asia/Shanghai. Capture NAV availability before the A-share open.
    - cron: "20 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Sync mode
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - backfill
          - preopen

permissions:
  contents: read

concurrency:
  group: premium-history-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements-premium-history.txt

      - name: Install dependencies
        run: python -m pip install --requirement automation/requirements-premium-history.txt

      - name: Sync premium history
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          python automation/premium_history_sync.py \
            --mode "$MODE" \
            --summary premium-history-sync-summary.json

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo '## Premium history sync' >> "$GITHUB_STEP_SUMMARY"
          if [ -f premium-history-sync-summary.json ]; then
            cat premium-history-sync-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No summary generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: premium-history-sync-${{ github.run_id }}
          path: premium-history-sync-summary.json
          if-no-files-found: warn
          retention-days: 30
