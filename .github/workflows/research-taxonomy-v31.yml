name: Research Taxonomy V3.2 Evidence and Regression
on:
  push:
    branches: [research/taxonomy-v3-20261112]
    paths:
      - 'research/taxonomy_v3/*.py'
      - 'research/taxonomy_v3/index_aliases.json'
      - 'research/taxonomy_v3/index_history_events_v32.json'
      - 'research/taxonomy_v3/fund_contract_evidence_v31.json'
      - 'research/taxonomy_v3/requirements.lock'
      - 'research/taxonomy_v3/snapshot/supplement_v32/**'
      - '.github/workflows/research-taxonomy-v31.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-taxonomy-v32
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned research dependencies
        run: python -m pip install -r research/taxonomy_v3/requirements.lock
      - name: Prepare frozen inputs and verify all evidence
        run: |
          mkdir -p /tmp/taxonomy-v32
          gh release download research-data-fullmarket-current --repo "$GH_REPO" \
            --pattern refreshed_daily_bars.parquet --dir /tmp/taxonomy-v32 || true
          expected="9d55f6e0a511be72609e799b19d04c1b44e2555374298bceef102a0481a067fb"
          actual=$(sha256sum /tmp/taxonomy-v32/refreshed_daily_bars.parquet 2>/dev/null | cut -d' ' -f1 || true)
          if [ "$actual" != "$expected" ]; then
            git fetch origin research/taxonomy-v3-evidence-20261112 --depth=1
            git show 8037109205eb36a3514c5f14d8f2f8c2dba3d351:research/taxonomy_v3/archive/taxonomy-v3-evidence-20261112.tar.gz > /tmp/taxonomy-v32/frozen.tar.gz
            mkdir -p /tmp/taxonomy-v32/archive
            tar -xzf /tmp/taxonomy-v32/frozen.tar.gz -C /tmp/taxonomy-v32/archive
            cp /tmp/taxonomy-v32/archive/refreshed_daily_bars.parquet /tmp/taxonomy-v32/
          fi
          echo "$expected  /tmp/taxonomy-v32/refreshed_daily_bars.parquet" | sha256sum -c -
          python -m research.taxonomy_v3.run_v32 --prepare-only --work /tmp/taxonomy-v32
      - name: Rebuild twice, validate semantics and verify byte reproducibility
        run: |
          python -m research.taxonomy_v3.run_v32 --work /tmp/taxonomy-v32
          cat research/taxonomy_v3/output_v32/REPORT_V32.md >> "$GITHUB_STEP_SUMMARY"
      - name: Persist only the research artifact directory
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/taxonomy_v3/output_v32
          git add -f research/taxonomy_v3/output_v32/classifications.parquet
          git diff --cached --quiet && exit 0
          git commit -m "research: freeze validated V3.2 classifications and evidence audit"
          # Concurrent source changes require a rebuild, not a stale rebase.
          git fetch origin research/taxonomy-v3-20261112
          test "$(git rev-parse origin/research/taxonomy-v3-20261112)" = "$GITHUB_SHA"
          git push origin HEAD:research/taxonomy-v3-20261112
      - name: Archive reproducible audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxonomy-v32-${{ github.run_id }}
          path: research/taxonomy_v3/output_v32/
          if-no-files-found: warn
          retention-days: 30
