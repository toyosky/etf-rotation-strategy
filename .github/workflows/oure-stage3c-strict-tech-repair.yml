name: OURE Stage3C Strict Tech Repair

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage3c_strict_tech_repair.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE3C_STRICT_TECH_REPAIR_DESIGN_20260914.md"
      - ".github/workflows/oure-stage3c-strict-tech-repair.yml"

permissions:
  contents: read
  actions: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements-full-market-ols.txt
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage3c_strict_tech_repair.py
      - name: Run Stage3C repaired exposure-disjoint search
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: >-
          python research/optimal_universe_reverse_engineering/oure_stage3c_strict_tech_repair.py
          --output-dir oure-stage3c-output
          --greedy-seeds 36
          --swap-shortlist 240
          --stochastic-steps 20000
          --random-per-k 500
      - name: Upload Stage3C artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage3c-strict-tech-repair-${{ github.run_id }}
          path: oure-stage3c-output/
          retention-days: 90
