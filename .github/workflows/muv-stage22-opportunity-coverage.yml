name: MUV Stage22 Opportunity Coverage Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "research/requirements-full-market-ols.txt"
      - "research/full_market_ols_storage.py"
      - "research/monthly_liquidity_cluster_universe.py"
      - "research/monthly_frozen_universe.py"
      - "research/validate_fixed15_vs_full_market.py"
      - "research/marginal_universe_value/model_stage22_opportunity_coverage.py"
      - "research/marginal_universe_value/STAGE22_OPPORTUNITY_COVERAGE_AUDIT_DESIGN_20260913.md"
      - "research/marginal_universe_value/experiment_registry.yaml"
      - ".github/actions/muv-publish/action.yml"
      - ".github/workflows/muv-stage22-opportunity-coverage.yml"

permissions:
  contents: read

concurrency:
  group: muv-stage22-opportunity-coverage
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Run Stage22 opportunity coverage audit
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/marginal_universe_value/model_stage22_opportunity_coverage.py

      - name: Publish Stage22 outputs
        if: always()
        uses: ./.github/actions/muv-publish
        with:
          report-file: muv-stage22-opportunity-coverage-report.json
          artifact-name: muv-stage22-opportunity-coverage-${{ github.run_id }}
          paths: |
            muv-stage22-opportunity-coverage-report.json
            muv-stage22-opportunity-coverage-months.csv
