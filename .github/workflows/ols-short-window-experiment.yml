name: OLS Short Window Experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
      PYTHONPATH: research
      OUTPUT_DIR: ols-short-window-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas sqlalchemy psycopg2-binary boto3 scipy tabulate
      - run: python research/post_ols_life/ols_short_window_experiment.py
      - run: cat ols-short-window-output/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ols-short-window-${{ github.run_id }}
          path: ols-short-window-output/
          retention-days: 30
