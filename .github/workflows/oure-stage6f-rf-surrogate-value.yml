name: OURE Stage6F RF Surrogate Value

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage6f_rf_surrogate_value.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE6F_RF_SURROGATE_VALUE_DESIGN_20260914.md"
      - ".github/workflows/oure-stage6f-rf-surrogate-value.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage6f_rf_surrogate_value.py
      - name: Run Stage6F
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage6f_rf_surrogate_value.py \
            --output-dir oure-stage6f-output
      - name: Upload Stage6F artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage6f-rf-surrogate-value-${{ github.run_id }}
          path: oure-stage6f-output
          retention-days: 90
