name: Research Rebuild Diffusion V2 Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/rebuild_market_context/audit_diffusion_v2.py'
      - '.github/workflows/research-rebuild-diffusion-v2.yml'
permissions:
  contents: write
concurrency:
  group: research-rebuild-diffusion-v2
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audited research dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "pyarrow>=18" "SQLAlchemy>=2,<3" "psycopg2-binary>=2.9,<3"
      - name: Compile frozen V1 and V2 studies
        run: |
          python -m py_compile research/rebuild_market_context/compute_indicators_v1.py research/rebuild_market_context/audit_diffusion_v2.py
          python research/rebuild_market_context/compute_indicators_v1.py --self-test
      - name: Download frozen all-market research release
        run: |
          mkdir -p /tmp/rebuild-diffusion-v2
          gh release download research-data-fullmarket-current --repo "$GH_REPO" \
            --pattern refreshed_daily_bars.parquet --dir /tmp/rebuild-diffusion-v2
          test -s /tmp/rebuild-diffusion-v2/refreshed_daily_bars.parquet
      - name: Audit diffusion incremental predictive value
        run: |
          python research/rebuild_market_context/audit_diffusion_v2.py \
            --parquet /tmp/rebuild-diffusion-v2/refreshed_daily_bars.parquet
      - name: Publish audit summary
        if: success()
        run: cat research/rebuild_market_context/diffusion_deep_audit_v2.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit research-only reproducible report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+toyosky@users.noreply.github.com"
          git add research/rebuild_market_context/diffusion_deep_audit_v2.json research/rebuild_market_context/diffusion_deep_audit_v2.md
          if git diff --cached --quiet; then
            echo "Report unchanged"
            exit 0
          fi
          git commit -m "research: document independent diffusion signal validation"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload detailed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-diffusion-v2-${{ github.run_id }}
          path: |
            research/rebuild_market_context/diffusion_deep_audit_v2.json
            research/rebuild_market_context/diffusion_deep_audit_v2.md
          if-no-files-found: warn
          retention-days: 30
