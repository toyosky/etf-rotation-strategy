name: Research Carrier Continuity Audit
on:
  workflow_dispatch:
  push:
    branches:
      - research/taxonomy-rebuild-validation-20261112
    paths:
      - 'research/taxonomy_v3/audit_carrier_continuity_v1.py'
      - '.github/workflows/research-carrier-continuity-v1.yml'
permissions:
  contents: write
concurrency:
  group: research-carrier-continuity-v1
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2.2,<3' 'numpy>=2,<3' 'pyarrow>=18,<24'
      - name: Static and toy checks
        run: |
          python -m py_compile research/taxonomy_v3/audit_carrier_continuity_v1.py
          python research/taxonomy_v3/audit_carrier_continuity_v1.py --self-test
      - name: Download frozen research data
        run: |
          mkdir -p /tmp/etf-carrier-audit
          gh release download research-data-fullmarket-current --repo "$GH_REPO" --pattern refreshed_daily_bars.parquet --dir /tmp/etf-carrier-audit
      - name: Audit index carrier changes
        run: |
          python research/taxonomy_v3/audit_carrier_continuity_v1.py --bars /tmp/etf-carrier-audit/refreshed_daily_bars.parquet --taxonomy research/taxonomy_v3/output_v32/classifications.parquet --summary research/taxonomy_v3/output_v32/summary.json
      - name: Save report
        if: success()
        run: |
          cat research/taxonomy_v3/output_v32/carrier_continuity_audit_v1.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/taxonomy_v3/output_v32/carrier_continuity_audit_v1.json research/taxonomy_v3/output_v32/carrier_continuity_audit_v1.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record index carrier continuity sensitivity'
          git pull --rebase origin research/taxonomy-rebuild-validation-20261112
          git push origin HEAD:research/taxonomy-rebuild-validation-20261112
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carrier-continuity-${{ github.run_id }}
          path: research/taxonomy_v3/output_v32/carrier_continuity_audit_v1.*
          if-no-files-found: warn
