name: OURE Stage6D Fixed-K30 Member Marginal

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage6d_fixed_k30_member_marginal.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE6D_FIXED_K30_MEMBER_MARGINAL_DESIGN_20260914.md"
      - ".github/workflows/oure-stage6d-fixed-k30-member-marginal.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements-full-market-ols.txt
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage6d_fixed_k30_member_marginal.py
      - name: Run Stage6D
        env:
          PYTHONPATH: research
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: >-
          python research/optimal_universe_reverse_engineering/oure_stage6d_fixed_k30_member_marginal.py
          --output-dir oure-stage6d-output
      - name: Upload Stage6D artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage6d-fixed-k30-member-marginal-${{ github.run_id }}
          path: oure-stage6d-output/
          retention-days: 90
