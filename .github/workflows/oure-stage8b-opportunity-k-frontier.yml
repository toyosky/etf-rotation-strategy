name: OURE Stage8B Opportunity K Frontier

on:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage8b_opportunity_k_frontier.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE8B_OPPORTUNITY_K_FRONTIER_DESIGN_20260915.md"
      - ".github/workflows/oure-stage8b-opportunity-k-frontier.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3 pyarrow
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage8b_opportunity_k_frontier.py
      - name: Run Stage8B
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage8b_opportunity_k_frontier.py \
            --output-dir oure-stage8b-output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage8b-opportunity-k-frontier-${{ github.run_id }}
          path: oure-stage8b-output/
          retention-days: 90
