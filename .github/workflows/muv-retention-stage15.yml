name: MUV Retention Stage15 Hurdle Identifiability

on:
  workflow_dispatch:
  push:
    paths:
      - "research/requirements-full-market-ols.txt"
      - "research/marginal_universe_value/build_retention_labels_v1.py"
      - "research/marginal_universe_value/build_retention_labels_v1_1.py"
      - "research/marginal_universe_value/build_retention_labels_v1_2.py"
      - "research/marginal_universe_value/build_retention_labels_v1_3.py"
      - "research/marginal_universe_value/build_retention_labels_v1_4.py"
      - "research/marginal_universe_value/model_retention_stage3_pairwise_sign.py"
      - "research/marginal_universe_value/model_retention_stage15_hurdle_identifiability.py"
      - ".github/workflows/muv-retention-stage15.yml"

permissions:
  contents: read

concurrency:
  group: muv-retention-stage15
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Build V1.4 labels locally
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/marginal_universe_value/build_retention_labels_v1_4.py --skip-upload

      - name: Stage 3 pairwise expected MUV
        run: python research/marginal_universe_value/model_retention_stage3_pairwise_sign.py

      - name: Stage 15 hurdle identifiability audit
        run: python research/marginal_universe_value/model_retention_stage15_hurdle_identifiability.py

      - name: Show Stage15 report
        if: always()
        run: |
          if [ -f muv-retention-stage15-report.json ]; then
            cat muv-retention-stage15-report.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Stage15 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muv-retention-stage15-${{ github.run_id }}
          path: |
            muv-retention-v1-summary.json
            muv-retention-labels-v1.parquet
            muv-retention-stage3-report.json
            muv-retention-stage3-predictions.csv
            muv-retention-stage15-report.json
            muv-retention-stage15-quintiles.csv
            muv-retention-stage15-monthly-ranks.csv
          if-no-files-found: ignore
          retention-days: 30
