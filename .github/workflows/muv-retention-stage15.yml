name: MUV Retention Stage15 Hurdle Identifiability

on:
  workflow_dispatch:
  push:
    paths:
      - "research/requirements-full-market-ols.txt"
      - "research/marginal_universe_value/build_retention_labels_v1*.py"
      - "research/marginal_universe_value/model_retention_stage3_pairwise_sign.py"
      - "research/marginal_universe_value/model_retention_stage15_hurdle_identifiability.py"
      - ".github/actions/muv-bootstrap/action.yml"
      - ".github/actions/muv-publish/action.yml"
      - ".github/workflows/muv-retention-stage15.yml"

permissions:
  contents: read

concurrency:
  group: muv-retention-stage15
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare V1.4 MUV labels
        uses: ./.github/actions/muv-bootstrap
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        with:
          label-version: v1.4
          builder: research/marginal_universe_value/build_retention_labels_v1_4.py

      - name: Stage 3 pairwise expected MUV
        run: python research/marginal_universe_value/model_retention_stage3_pairwise_sign.py

      - name: Stage 15 hurdle identifiability audit
        run: python research/marginal_universe_value/model_retention_stage15_hurdle_identifiability.py

      - name: Publish Stage15 outputs
        if: always()
        uses: ./.github/actions/muv-publish
        with:
          report-file: muv-retention-stage15-report.json
          artifact-name: muv-retention-stage15-${{ github.run_id }}
          paths: |
            muv-retention-v1-summary.json
            muv-retention-labels-v1.parquet
            muv-retention-stage3-report.json
            muv-retention-stage3-predictions.csv
            muv-retention-stage15-report.json
            muv-retention-stage15-quintiles.csv
            muv-retention-stage15-monthly-ranks.csv
