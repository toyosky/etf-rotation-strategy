name: Universe Size Stage1A Structure Robustness

on:
  workflow_dispatch:
  push:
    paths:
      - "research/universe_size_then_composition/STAGE1A_STRUCTURE_ROBUSTNESS_DESIGN_20260914.md"
      - "research/universe_size_then_composition/stage1a_structure_robustness.py"
      - ".github/workflows/universe-size-stage1a-structure.yml"

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Compile frozen analyzer
        run: python -m py_compile research/universe_size_then_composition/stage1a_structure_robustness.py

      - name: Download frozen Stage1 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stage1_source
          gh run download 34772895471 \
            --repo toyosky/etf-rotation-strategy \
            --name universe-size-stage1-repair-34772895471 \
            --dir stage1_source

      - name: Run Stage1A structure audit
        run: |
          python research/universe_size_then_composition/stage1a_structure_robustness.py \
            --source-dir stage1_source \
            --output-dir stage1a-structure-output

      - name: Show report
        if: always()
        run: |
          test -f stage1a-structure-output/stage1a_report.json && cat stage1a-structure-output/stage1a_report.json || true

      - name: Upload Stage1A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-size-stage1a-structure-${{ github.run_id }}
          path: stage1a-structure-output/
          if-no-files-found: warn
          retention-days: 30
