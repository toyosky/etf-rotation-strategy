name: Cross Sectional Extreme Score Diagnostic

on:
  push:
    paths:
      - 'research/cross_sectional_extreme_score_diagnostic.py'
      - 'research/requirements-full-market-ols.txt'
      - '.github/workflows/cross-sectional-extreme-score-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Run cross-sectional extreme score diagnostic
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/cross_sectional_extreme_score_diagnostic.py \
            --summary-path cross-sectional-extreme-score-summary.json \
            --daily-path cross-sectional-extreme-score-daily.csv \
            --quartile-path cross-sectional-extreme-score-quartiles.csv
      - name: Show summary
        run: |
          cat cross-sectional-extreme-score-summary.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat cross-sectional-extreme-score-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-sectional-extreme-score-${{ github.run_id }}
          path: |
            cross-sectional-extreme-score-summary.json
            cross-sectional-extreme-score-daily.csv
            cross-sectional-extreme-score-quartiles.csv
          retention-days: 30
