name: OURE Stage4E External Relay Replication

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage4e_external_relay_replication.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE4E_EXTERNAL_RELAY_REPLICATION_DESIGN_20260914.md"
      - ".github/workflows/oure-stage4e-external-relay.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements-full-market-ols.txt
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage4e_external_relay_replication.py
      - name: Download frozen Stage3C artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34828750914 -n oure-stage3c-strict-tech-repair-34828750914 -D stage3c-artifact
      - name: Run external relay replication
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: >-
          python research/optimal_universe_reverse_engineering/oure_stage4e_external_relay_replication.py
          --stage3c-dir stage3c-artifact
          --output-dir oure-stage4e-output
      - name: Upload Stage4E artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage4e-external-relay-${{ github.run_id }}
          path: oure-stage4e-output/
          retention-days: 90
