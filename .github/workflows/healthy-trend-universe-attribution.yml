name: Healthy Trend Universe Attribution

on:
  push:
    paths:
      - 'research/healthy_trend_universe_attribution.py'
      - '.github/workflows/healthy-trend-universe-attribution.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Run healthy-trend attribution
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/healthy_trend_universe_attribution.py \
            --summary-path healthy-trend-universe-attribution-summary.json \
            --entries-path healthy-trend-universe-attribution-entries.csv \
            --pairs-path healthy-trend-universe-attribution-pairs.csv
      - name: Show summary
        run: |
          cat healthy-trend-universe-attribution-summary.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat healthy-trend-universe-attribution-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: healthy-trend-universe-attribution-${{ github.run_id }}
          path: |
            healthy-trend-universe-attribution-summary.json
            healthy-trend-universe-attribution-entries.csv
            healthy-trend-universe-attribution-pairs.csv
          retention-days: 30
