name: Research Drawdown to Rebuild Episodes
on:
  workflow_dispatch:
  push:
    branches:
      - research/taxonomy-rebuild-validation-20261112
    paths:
      - 'research/taxonomy_v3/audit_drawdown_rebuild_episode_v1.py'
      - '.github/workflows/research-drawdown-rebuild-episodes-v1.yml'
permissions:
  contents: write
concurrency:
  group: research-drawdown-rebuild-episodes-v1
  cancel-in-progress: false
jobs:
  episodes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2.2,<3' 'numpy>=2,<3' 'pyarrow>=18,<24'
      - name: Unit tests
        run: |
          python -m py_compile research/taxonomy_v3/audit_drawdown_rebuild_episode_v1.py
          python research/taxonomy_v3/audit_drawdown_rebuild_episode_v1.py --self-test
      - name: Download frozen data
        run: |
          mkdir -p /tmp/rebound-audit
          gh release download research-data-fullmarket-current --repo "$GH_REPO" --pattern refreshed_daily_bars.parquet --dir /tmp/rebound-audit
          test -s /tmp/rebound-audit/refreshed_daily_bars.parquet
      - name: Compute episodes
        run: |
          python research/taxonomy_v3/audit_drawdown_rebuild_episode_v1.py \
            --bars /tmp/rebound-audit/refreshed_daily_bars.parquet \
            --taxonomy research/taxonomy_v3/output_v32/classifications.parquet \
            --summary research/taxonomy_v3/output_v32/summary.json
      - name: Report
        if: success()
        run: cat research/taxonomy_v3/output_v32/drawdown_rebuild_episode_v1.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/taxonomy_v3/output_v32/drawdown_rebuild_episode_v1.json research/taxonomy_v3/output_v32/drawdown_rebuild_episode_v1.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record drawdown rebound detection audit'
          git pull --rebase origin research/taxonomy-rebuild-validation-20261112
          git push origin HEAD:research/taxonomy-rebuild-validation-20261112
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawdown-rebuild-${{ github.run_id }}
          path: |
            research/taxonomy_v3/output_v32/drawdown_rebuild_episode_v1.json
            research/taxonomy_v3/output_v32/drawdown_rebuild_episode_v1.md
          if-no-files-found: warn
