name: MUV Stage24 Admission Worthiness State Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "research/requirements-full-market-ols.txt"
      - "research/full_market_ols_storage.py"
      - "research/validate_fixed15_vs_full_market.py"
      - "research/marginal_universe_value/model_stage24_admission_worthiness.py"
      - "research/marginal_universe_value/STAGE24_ADMISSION_WORTHINESS_STATE_AUDIT_DESIGN_20260913.md"
      - "research/marginal_universe_value/experiment_registry.yaml"
      - ".github/actions/muv-publish/action.yml"
      - ".github/workflows/muv-stage24-admission-worthiness.yml"

permissions:
  contents: read

concurrency:
  group: muv-stage24-admission-worthiness
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Run Stage24 admission worthiness state audit
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/marginal_universe_value/model_stage24_admission_worthiness.py

      - name: Publish Stage24 outputs
        if: always()
        uses: ./.github/actions/muv-publish
        with:
          report-file: muv-stage24-admission-worthiness-report.json
          artifact-name: muv-stage24-admission-worthiness-${{ github.run_id }}
          paths: |
            muv-stage24-admission-worthiness-report.json
            muv-stage24-admission-worthiness-months.csv
