name: OURE Stage7D Long History Mechanism

on:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage7d_long_history_mechanism.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE7D_LONG_HISTORY_MECHANISM_DESIGN_20260915.md"
      - ".github/workflows/oure-stage7d-long-history-mechanism.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage7d_long_history_mechanism.py
      - name: Run Stage7D
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage7d_long_history_mechanism.py \
            --output-dir oure-stage7d-output
      - name: Upload Stage7D artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage7d-long-history-mechanism-${{ github.run_id }}
          path: oure-stage7d-output/
          retention-days: 90
