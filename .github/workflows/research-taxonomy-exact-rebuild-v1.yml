name: Research V3.2 Exact Index Rebuild Age Audit
on:
  workflow_dispatch:
  push:
    branches:
      - research/taxonomy-rebuild-validation-20261112
    paths:
      - 'research/taxonomy_v3/audit_exact_rebuild_v1.py'
      - '.github/workflows/research-taxonomy-exact-rebuild-v1.yml'
permissions:
  contents: write
concurrency:
  group: research-taxonomy-exact-rebuild-v1
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned-major research dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=2,<3' 'pyarrow>=18,<24'
      - name: Source and test audit
        run: |
          python -m py_compile research/taxonomy_v3/audit_exact_rebuild_v1.py
          python research/taxonomy_v3/audit_exact_rebuild_v1.py --self-test
      - name: Download frozen full-market snapshot
        run: |
          mkdir -p /tmp/taxonomy-exact-v1
          gh release download research-data-fullmarket-current --repo "$GH_REPO" \
            --pattern refreshed_daily_bars.parquet --dir /tmp/taxonomy-exact-v1
          test -s /tmp/taxonomy-exact-v1/refreshed_daily_bars.parquet
      - name: Run read-only retrospective group and survival comparison
        run: |
          python research/taxonomy_v3/audit_exact_rebuild_v1.py \
            --bars /tmp/taxonomy-exact-v1/refreshed_daily_bars.parquet \
            --taxonomy research/taxonomy_v3/output_v32/classifications.parquet \
            --summary research/taxonomy_v3/output_v32/summary.json
      - name: Publish summary
        if: success()
        run: cat research/taxonomy_v3/output_v32/rebuild_exact_audit_v1.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit audit outputs to research branch only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/taxonomy_v3/output_v32/rebuild_exact_audit_v1.json research/taxonomy_v3/output_v32/rebuild_exact_audit_v1.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: record V3.2 exact-index rebuild age audit'
          git pull --rebase origin research/taxonomy-rebuild-validation-20261112
          git push origin HEAD:research/taxonomy-rebuild-validation-20261112
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taxonomy-exact-rebuild-${{ github.run_id }}
          path: |
            research/taxonomy_v3/output_v32/rebuild_exact_audit_v1.json
            research/taxonomy_v3/output_v32/rebuild_exact_audit_v1.md
          if-no-files-found: warn
          retention-days: 30
