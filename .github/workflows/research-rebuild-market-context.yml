name: Research Rebuild Market Context Indicators
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Fundamental Audit Trigger'
    types:
      - completed
  push:
    paths:
      - 'research/rebuild_market_context/compute_indicators_v1.py'
      - '.github/workflows/research-rebuild-market-context.yml'
permissions:
  contents: write
concurrency:
  group: research-rebuild-market-context
  cancel-in-progress: false
jobs:
  compute:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip unchanged source snapshot after upstream workflow
        id: freshness
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          market_path=Path('data/full-market-rebuild-latest.json')
          report_path=Path('research/rebuild_market_context/indicators_v1.json')
          market=json.loads(market_path.read_text()) if market_path.exists() else {}
          report=json.loads(report_path.read_text()) if report_path.exists() else {}
          same_date=bool(market.get('as_of') and market['as_of']==report.get('source',{}).get('as_of'))
          same_sha=bool(market.get('sha256_snapshot') and market['sha256_snapshot']==report.get('source',{}).get('sha256'))
          should_run=os.getenv('GITHUB_EVENT_NAME')!='workflow_run' or not(same_date and same_sha)
          print('run='+('true' if should_run else 'false'))
          PY
      - uses: actions/setup-python@v5
        if: steps.freshness.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install isolated research dependencies
        if: steps.freshness.outputs.run == 'true'
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "pyarrow>=18" "SQLAlchemy>=2,<3" "psycopg2-binary>=2.9,<3"
      - name: Compile and run point-in-time sanity test
        if: steps.freshness.outputs.run == 'true'
        run: |
          python -m py_compile research/rebuild_market_context/compute_indicators_v1.py
          python research/rebuild_market_context/compute_indicators_v1.py --self-test
      - name: Download frozen full-market research prices
        if: steps.freshness.outputs.run == 'true'
        run: |
          mkdir -p /tmp/rebuild-market-context
          gh release download research-data-fullmarket-current --repo "$GH_REPO" \
            --pattern refreshed_daily_bars.parquet --dir /tmp/rebuild-market-context
          test -s /tmp/rebuild-market-context/refreshed_daily_bars.parquet
      - name: Compute three no-future-data indicators and validate historical cohorts
        if: steps.freshness.outputs.run == 'true'
        run: |
          python research/rebuild_market_context/compute_indicators_v1.py \
            --parquet /tmp/rebuild-market-context/refreshed_daily_bars.parquet
      - name: Publish summary
        if: success() && steps.freshness.outputs.run == 'true'
        run: cat research/rebuild_market_context/README_RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Persist research-only output
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/rebuild_market_context/indicators_v1.json research/rebuild_market_context/README_RESULTS.md data/rebuild-market-context-latest.json
          if git diff --cached --quiet; then
            echo "No research result changes"
            exit 0
          fi
          git commit -m "research: update ETF rebuilding breadth persistence and sector strength"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload research report
        if: always() && steps.freshness.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-market-context-${{ github.run_id }}
          path: |
            research/rebuild_market_context/indicators_v1.json
            research/rebuild_market_context/README_RESULTS.md
            data/rebuild-market-context-latest.json
          if-no-files-found: warn
          retention-days: 30
