name: Universe Size Stage2 Remaining Trend Life

on:
  workflow_dispatch:
  push:
    paths:
      - "research/universe_size_then_composition/stage2_remaining_trend_life.py"
      - "research/universe_size_then_composition/STAGE2_TREND_EPISODE_REMAINING_LIFE_DESIGN_20260914.md"
      - ".github/workflows/universe-size-stage2.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: universe-size-stage2-remaining-life
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Syntax check Stage2
        run: python -m py_compile research/universe_size_then_composition/stage2_remaining_trend_life.py

      - name: Download frozen Stage1 primary artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stage1_artifact
          gh run download 34772895471 \
            --repo toyosky/etf-rotation-strategy \
            --name universe-size-stage1-repair-34772895471 \
            --dir stage1_artifact

      - name: Run frozen Stage2 mechanism audit
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/universe_size_then_composition/stage2_remaining_trend_life.py \
            --stage1-artifact-dir stage1_artifact \
            --output-dir stage2-remaining-trend-life-output

      - name: Publish Stage2 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-size-stage2-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            stage2-remaining-trend-life-output/stage2_report.json
            stage2-remaining-trend-life-output/stage2_monthly_k_mechanism.csv
            stage2-remaining-trend-life-output/stage2_first_admission_episode_labels.parquet
            stage2-remaining-trend-life-output/stage1_pairwise_corr_supplement.csv
