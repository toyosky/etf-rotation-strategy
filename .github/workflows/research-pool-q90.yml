name: Research Pool Q90 Cross Asset
on:
  push:
    branches: [research/top1-downside-20261120]
    paths: ['.github/workflows/research-pool-q90.yml', 'research/top1_downside/code/pool_q90_cross_asset.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pool:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.5 scipy==1.18.1 scikit-learn
      - run: python research/top1_downside/code/pool_q90_cross_asset.py
      - uses: actions/upload-artifact@v7
        with:
          name: pool-q90-cross-asset
          path: pool_q90_results.json
          if-no-files-found: error
          retention-days: 30
