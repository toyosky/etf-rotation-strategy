name: Fundamental Audit Trigger

on:
  push:
    paths:
      - 'automation/build_fundamental_audit_trigger.py'
      - 'automation/notify_rebuild_candidates.py'
      - 'automation/test_daily_notification.py'
      - 'automation/build_daily_premium_snapshot.py'
      - 'automation/refresh_full_market_rebuild.py'
      - '.github/workflows/fundamental-audit-trigger.yml'
  workflow_run:
    workflows:
      - 'Tencent HFQ Daily Bars Sync'
      - 'Live Forward Strategy Tracker'
    types:
      - completed
  schedule:
    # Fallback only. Primary trigger is completion of Tencent HFQ Daily Bars Sync.
    - cron: "0 12 * * 1-5"  # 20:00 Asia/Shanghai fallback: allow full-market quote publication
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fundamental-audit-trigger
  cancel-in-progress: true  # supersede stale premarket runs; report is idempotent by date and candidate set

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
      PYTHONPATH: research

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js for Tencent market-wide data requests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: python -m pip install numpy pandas sqlalchemy psycopg2-binary boto3 pyarrow

      - name: Compile trigger and daily market-wide scanner
        run: python -m py_compile automation/build_fundamental_audit_trigger.py automation/refresh_full_market_rebuild.py automation/notify_rebuild_candidates.py

      - name: Validate combined daily notification contract
        run: python -m unittest automation.test_daily_notification

      - name: Build fundamental-audit trigger
        run: python automation/build_fundamental_audit_trigger.py

      - name: Sync Premium10 for current dynamic candidates
        shell: bash
        run: |
          python -m pip install --requirement automation/requirements-premium-history.txt
          if ! python automation/premium_history_sync.py \
            --mode preopen --lookback-days 21 --only-selected \
            --signals-file data/fundamental-audit-trigger.json \
            --summary /tmp/daily-premium-sync-summary.json; then
            echo "::warning::Candidate premium sync failed; daily message must show UNVERIFIED, never assume zero premium."
          fi

      - name: Load latest independently verified full-market research snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p /tmp/etf-full-market-base
          if gh release view research-data-fullmarket-current --repo "$GH_REPO" >/dev/null 2>&1; then
            TAG=research-data-fullmarket-current
          else
            TAG=research-data-fullmarket-20261020
          fi
          gh release download "$TAG" --repo "$GH_REPO" \
            --pattern refreshed_daily_bars.parquet --dir /tmp/etf-full-market-base
          test -s /tmp/etf-full-market-base/refreshed_daily_bars.parquet
          echo "Full-market historical base: $TAG"

      - name: Refresh listed-market prices and compute all qualifying rebuild signals
        env:
          MARKET_AS_OF: ${{ github.event.inputs.as_of || '' }}
        run: |
          AS_OF="$(python -c "import json;print(json.load(open('data/fundamental-audit-trigger.json',encoding='utf-8'))['market_data_date'])")"
          echo "Using latest completed market session: $AS_OF"
          python -m automation.refresh_full_market_rebuild \
            --as-of "$AS_OF" \
            --resume-path /tmp/etf-full-market-base/refreshed_daily_bars.parquet \
            --out research/full_market_rebuild/today_output
          cp research/full_market_rebuild/today_output/today_report.json data/full-market-rebuild-latest.json

      - name: Build dated Premium10 snapshot for OLS candidate
        run: |
          python automation/build_daily_premium_snapshot.py \
            --current data/fundamental-audit-trigger.json \
            --output /tmp/daily-premium-snapshot.json

      - name: Validate and preview unified OLS + full-market rebuild report
        shell: bash
        run: |
          git show HEAD:data/fundamental-audit-trigger.json > /tmp/previous-fundamental-audit-trigger.json 2>/dev/null || echo '{}' > /tmp/previous-fundamental-audit-trigger.json
          git show HEAD:data/full-market-rebuild-latest.json > /tmp/previous-market-report.json 2>/dev/null || echo '{}' > /tmp/previous-market-report.json
          python automation/notify_rebuild_candidates.py \
            --previous /tmp/previous-fundamental-audit-trigger.json \
            --current data/fundamental-audit-trigger.json \
            --previous-market /tmp/previous-market-report.json \
            --market-report data/full-market-rebuild-latest.json \
            --premium-snapshot /tmp/daily-premium-snapshot.json \
            --dry-run --output-markdown /tmp/full-market-daily-report.md

      - name: Send daily close report via PushPlus
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        shell: bash
        run: |
          python automation/notify_rebuild_candidates.py \
            --previous /tmp/previous-fundamental-audit-trigger.json \
            --current data/fundamental-audit-trigger.json \
            --previous-market /tmp/previous-market-report.json \
            --market-report data/full-market-rebuild-latest.json \
            --premium-snapshot /tmp/daily-premium-snapshot.json

      - name: Commit trigger snapshot
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/fundamental-audit-trigger.json data/full-market-rebuild-latest.json)" ]; then
            echo "Fundamental-audit trigger unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamental-audit-trigger.json data/full-market-rebuild-latest.json
          git commit -m "data: refresh fundamental audit trigger"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Update private rolling full-market snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG=research-data-fullmarket-current
          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GH_REPO" --target main \
              --title "ETF daily full-market research snapshot (rolling)" \
              --notes "Research only. Snapshot is date-stamped in today_report.json; excludes stale symbols from current rebuild signals."
          fi
          gh release upload "$TAG" \
            research/full_market_rebuild/today_output/refreshed_daily_bars.parquet \
            research/full_market_rebuild/today_output/today_report.json \
            research/full_market_rebuild/today_output/today_signals.csv \
            --repo "$GH_REPO" --clobber

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo '## Fundamental audit trigger' >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/fundamental-audit-trigger.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          x=json.load(open('data/fundamental-audit-trigger.json',encoding='utf-8'))
          print(json.dumps({
              'market_data_date': x.get('market_data_date'),
              'current_holding': x.get('current_holding'),
              'next_strategy_target': x.get('next_strategy_target'),
              'audit_required': x.get('audit_required'),
              'qualified_candidates': x.get('qualified_candidates'),
              'trend_watch': x.get('trend_watch'),
          },ensure_ascii=False,indent=2))
          PY
          fi
          if [ -f data/full-market-rebuild-latest.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m=json.load(open('data/full-market-rebuild-latest.json',encoding='utf-8'))
          print(json.dumps({
            'market_as_of':m.get('as_of'),
            'covered':m.get('symbols_with_asof_close'),
            'listed':m.get('listed_requested'),
            'coverage':m.get('asof_coverage'),
            'full_market_rebuild_total':m.get('raw_qualified'),
            'all_first_qualification_dates':[x.get('first_qualified_date') for x in m.get('qualified_candidates',[])],
          },ensure_ascii=False,indent=2))
          PY
          fi

      - name: Upload trigger artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fundamental-audit-trigger-${{ github.run_id }}
          path: |
            data/fundamental-audit-trigger.json
            data/full-market-rebuild-latest.json
            research/full_market_rebuild/today_output/today_signals.csv
            /tmp/full-market-daily-report.md
            /tmp/daily-premium-snapshot.json
            /tmp/daily-premium-sync-summary.json
          if-no-files-found: warn
          retention-days: 30
