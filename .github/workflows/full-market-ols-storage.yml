name: Full Market OLS Storage Archive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-market-ols-storage
  cancel-in-progress: false

jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Build OLS features, archive Parquet, and write compact episodes
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          SUPABASE_STORAGE_S3_ENDPOINT: https://gsyziuzezmmnvgdoazkg.storage.supabase.co/storage/v1/s3
          SUPABASE_STORAGE_S3_REGION: ap-southeast-1
          SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
          SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_STORAGE_BUCKET: etf-research-archive
        run: python research/full_market_ols_storage.py --summary-path full-market-ols-summary.json

      - name: Show summary
        if: always()
        run: |
          if [ -f full-market-ols-summary.json ]; then
            cat full-market-ols-summary.json
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat full-market-ols-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-market-ols-summary-${{ github.run_id }}
          path: full-market-ols-summary.json
          if-no-files-found: ignore
          retention-days: 30
