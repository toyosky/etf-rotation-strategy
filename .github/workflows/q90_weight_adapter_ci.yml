name: M1 position sizing adapter CI (research only)
on:
  pull_request:
    paths:
      - 'strategy/main.py'
      - 'tests/test_m1_position_control.py'
      - 'docs/strategy-spec.md'
      - '.github/workflows/q90_weight_adapter_ci.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile strategy and M1 tests
        run: python -m py_compile strategy/main.py tests/test_m1_position_control.py
      - name: Unit test M1 sizing and execution adapter
        run: python -m unittest discover -s tests -p 'test_m1_position_control.py' -v
      - name: Run existing execution-protection regression tests
        run: python -m unittest strategy.test_execution_protection -v
