name: OURE Stage6O RF-high Winner Member Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage6o_rf_high_winner_member_audit.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE6O_RF_HIGH_WINNER_MEMBER_AUDIT_DESIGN_20260915.md"
      - ".github/workflows/oure-stage6o-rf-high-winner-member-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage6o_rf_high_winner_member_audit.py
      - name: Run Stage6O
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage6o_rf_high_winner_member_audit.py \
            --output-dir oure-stage6o-output
      - name: Upload Stage6O artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage6o-rf-high-winner-member-audit-${{ github.run_id }}
          path: oure-stage6o-output
          retention-days: 90
