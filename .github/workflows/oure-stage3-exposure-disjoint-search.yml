name: OURE Stage3 Exposure-Disjoint Search

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage3_exposure_disjoint_search.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE3_EXPOSURE_DISJOINT_SEARCH_DESIGN_20260914.md"
      - ".github/workflows/oure-stage3-exposure-disjoint-search.yml"

permissions:
  contents: read
  actions: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements-full-market-ols.txt
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage3_exposure_disjoint_search.py
      - name: Run exposure-disjoint search
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: >-
          python research/optimal_universe_reverse_engineering/oure_stage3_exposure_disjoint_search.py
          --output-dir oure-stage3-output
      - name: Upload Stage3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage3-exposure-disjoint-${{ github.run_id }}
          path: oure-stage3-output/
          retention-days: 90
