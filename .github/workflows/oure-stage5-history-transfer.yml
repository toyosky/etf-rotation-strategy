name: OURE Stage5 Historical Universe Transfer

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage5_history_transfer.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE5_HISTORY_TRANSFER_DESIGN_20260914.md"
      - ".github/workflows/oure-stage5-history-transfer.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements-full-market-ols.txt
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage5_history_transfer.py
      - name: Run Stage5 history transfer
        env:
          PYTHONPATH: research
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: >-
          python research/optimal_universe_reverse_engineering/oure_stage5_history_transfer.py
          --output-dir oure-stage5-output
      - name: Upload Stage5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage5-history-transfer-${{ github.run_id }}
          path: oure-stage5-output/
          retention-days: 90
