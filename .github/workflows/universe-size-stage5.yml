name: Universe Size Stage5 Conservative K15 Composition

on:
  workflow_dispatch:
  push:
    paths:
      - "research/universe_size_then_composition/stage5_conservative_k15_executable.py"
      - "research/universe_size_then_composition/STAGE5_CONSERVATIVE_K15_EXECUTABLE_DESIGN_20260914.md"
      - ".github/workflows/universe-size-stage5.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements-full-market-ols.txt
      - name: Syntax check
        run: python -m py_compile research/universe_size_then_composition/stage5_conservative_k15_executable.py
      - name: Download frozen Stage1 base artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34772895471 -n universe-size-stage1-repair-34772895471 -D stage1-artifact
      - name: Download frozen Stage4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34791802474 -n universe-size-stage4-34791802474 -D stage4-artifact
      - name: Run frozen Stage5 audit
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: >-
          python research/universe_size_then_composition/stage5_conservative_k15_executable.py
          --stage1-dir stage1-artifact
          --stage4-dir stage4-artifact
          --output-dir stage5-output
      - name: Upload Stage5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: universe-size-stage5-${{ github.run_id }}
          path: stage5-output/
          retention-days: 90
