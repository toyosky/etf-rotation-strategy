name: Walk Forward Candidate Pool

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/walk_forward_candidate_pool.py'
      - '.github/workflows/walk-forward-candidate-pool.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - name: Install dependencies
        run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Run walk-forward candidate-pool backtest
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/walk_forward_candidate_pool.py \
            --summary-path walk-forward-candidate-pool-summary.json \
            --daily-path walk-forward-candidate-pool-daily.csv \
            --episodes-path walk-forward-episode-admission.csv

      - name: Show summary
        run: |
          cat walk-forward-candidate-pool-summary.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat walk-forward-candidate-pool-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-candidate-pool-${{ github.run_id }}
          path: |
            walk-forward-candidate-pool-summary.json
            walk-forward-candidate-pool-daily.csv
            walk-forward-episode-admission.csv
          retention-days: 30
