name: OURE Stage8N Internal Regime Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research/optimal_universe_reverse_engineering/oure_stage8n_internal_regime_diagnostic.py'
      - '.github/workflows/oure-stage8n-internal-regime-diagnostic.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q numpy pandas scipy sqlalchemy psycopg2-binary boto3 scikit-learn
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage8n_internal_regime_diagnostic.py
      - name: Run Stage8N
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: python research/optimal_universe_reverse_engineering/oure_stage8n_internal_regime_diagnostic.py --output-dir oure-stage8n-output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage8n-internal-regime-diagnostic-${{ github.run_id }}
          path: oure-stage8n-output/
          retention-days: 90
