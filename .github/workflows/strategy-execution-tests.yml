name: Strategy execution protection tests

on:
  push:
    paths:
      - 'strategy/**'
      - '.github/workflows/strategy-execution-tests.yml'
  pull_request:
    paths:
      - 'strategy/**'
      - '.github/workflows/strategy-execution-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - run: python -m py_compile strategy/main.py
      - run: python -m unittest discover -s strategy -p 'test_*.py' -v
