name: OURE Stage7A Fix15 Compare

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage7a_fix15_compare.py"
      - ".github/workflows/oure-stage7a-fix15-compare.yml"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3
      - name: Run comparison
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: python research/optimal_universe_reverse_engineering/oure_stage7a_fix15_compare.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage7a-fix15-compare-${{ github.run_id }}
          path: oure-stage7a-fix15-compare-output
          retention-days: 90
