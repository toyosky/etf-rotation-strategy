name: Research Two Down Days After Rebuild
on:
  push:
    paths:
      - 'research/rebuild_diffusion/two_down_after_rebuild.py'
      - '.github/workflows/research-rebuild-two-down.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-rebuild-two-down
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "pyarrow>=18" "SQLAlchemy>=2,<3"
      - name: Verify script syntax
        run: python -m py_compile research/rebuild_diffusion/two_down_after_rebuild.py
      - name: Download archived full market history
        run: |
          mkdir -p /tmp/fullmarket
          gh release download research-data-fullmarket-current --repo "$GH_REPO" --pattern refreshed_daily_bars.parquet --dir /tmp/fullmarket
          test -s /tmp/fullmarket/refreshed_daily_bars.parquet
      - name: Compare immediate entry against two consecutive declines
        run: |
          python -m research.rebuild_diffusion.two_down_after_rebuild \
            --parquet /tmp/fullmarket/refreshed_daily_bars.parquet \
            --events research/rebuild_diffusion/historical_diffusion_results.json \
            --output research/rebuild_diffusion/two_down_after_rebuild_results.json
      - name: Commit historical experiment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/rebuild_diffusion/two_down_after_rebuild_results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: archive conditional two-day pullback study"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-rebuild-two-down-${{ github.run_id }}
          path: research/rebuild_diffusion/two_down_after_rebuild_results.json
          if-no-files-found: warn
