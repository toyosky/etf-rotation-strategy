name: Research Current ETF Market Rebuild
on:
  push:
    branches:
      - research/full-market-rebuild-v1
    paths:
      - '.github/workflows/research-current-etf-market.yml'
      - 'research/full_market_rebuild/refresh_current_market.py'
  workflow_dispatch:
    inputs:
      max_symbols:
        description: '0 means all current listed ETF/LOF, nonzero for test'
        type: number
        default: 0
      as_of:
        description: 'Trade date YYYY-MM-DD'
        type: string
        default: '2026-10-20'
concurrency:
  group: research-current-etf-market-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  refresh-and-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
      SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
      SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
      MARKET_AS_OF: ${{ inputs.as_of || '2026-10-20' }}
      MARKET_MAX_SYMBOLS: ${{ inputs.max_symbols || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install analytical dependencies
        run: python -m pip install numpy pandas sqlalchemy psycopg2-binary boto3 pyarrow
      - name: Reuse already verified research market snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p research/full_market_rebuild/resume
          gh release download research-data-fullmarket-20261020 \
            --repo "$GH_REPO" \
            --pattern refreshed_daily_bars.parquet \
            --dir research/full_market_rebuild/resume \
            || echo "No previous snapshot available; rebuild from frozen archive"
      - name: Compute refreshed signals across all listed ETFs and LOFs
        run: |
          python -m research.full_market_rebuild.refresh_current_market \
            --as-of "$MARKET_AS_OF" \
            --max-symbols "$MARKET_MAX_SYMBOLS" \
            --resume-path research/full_market_rebuild/resume/refreshed_daily_bars.parquet \
            --out research/full_market_rebuild/today_output
      - name: Publish snapshot and research diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-current-etf-market-${{ github.run_id }}
          path: |
            research/full_market_rebuild/today_output/today_report.json
            research/full_market_rebuild/today_output/today_signals.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve refreshed full-market snapshot in private GitHub Release
        if: success() && env.MARKET_MAX_SYMBOLS == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="research-data-fullmarket-20261020"
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "ETF market data as of 2026-10-20 (research)" \
              --notes "Research only: frozen 2026-09-17 archive plus Tencent HFQ updates. Inspect coverage before relying on completeness."
          gh release upload "$TAG" \
            research/full_market_rebuild/today_output/refreshed_daily_bars.parquet \
            research/full_market_rebuild/today_output/today_report.json \
            research/full_market_rebuild/today_output/today_signals.csv \
            --repo "$GH_REPO" --clobber
