name: Volume Exit Study
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/volume_exit_study.py'
      - '.github/workflows/volume-exit-study.yml'
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas sqlalchemy psycopg2-binary
      - run: python research/volume_exit_study.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/volume_exit_study_20260930.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: add volume exit study results"
          git push
