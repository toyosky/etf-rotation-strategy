name: Selected Top1 Lifespan Diagnostic

on:
  push:
    paths:
      - 'research/selected_top1_lifespan_diagnostic.py'
      - '.github/workflows/selected-top1-lifespan-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Run selected Top1 lifespan diagnostic
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/selected_top1_lifespan_diagnostic.py \
            --summary-path selected-top1-lifespan-summary.json \
            --entries-path selected-top1-lifespan-entries.csv \
            --paired-path selected-top1-lifespan-paired.csv
      - name: Show summary
        run: |
          cat selected-top1-lifespan-summary.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat selected-top1-lifespan-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: selected-top1-lifespan-${{ github.run_id }}
          path: |
            selected-top1-lifespan-summary.json
            selected-top1-lifespan-entries.csv
            selected-top1-lifespan-paired.csv
          retention-days: 30
