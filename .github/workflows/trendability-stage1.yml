name: Trendability Stage1 WalkForward

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/trendability_stage1_walkforward.py'
      - 'research/trendability_stage1_preregister_20260911.md'
      - '.github/workflows/trendability-stage1.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Run preregistered Stage1
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/trendability_stage1_walkforward.py \
            --summary-path trendability-stage1-summary.json \
            --events-path trendability-stage1-events.csv \
            --scores-path trendability-stage1-monthly-scores.csv \
            --reps-path trendability-stage1-monthly-representatives.csv
      - name: Show result
        run: |
          cat trendability-stage1-summary.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat trendability-stage1-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: trendability-stage1-${{ github.run_id }}
          path: |
            trendability-stage1-summary.json
            trendability-stage1-events.csv
            trendability-stage1-monthly-scores.csv
            trendability-stage1-monthly-representatives.csv
          retention-days: 30
