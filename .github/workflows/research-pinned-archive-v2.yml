name: Research Pinned Archive Provenance V2
on:
  workflow_dispatch:
  push:
    branches:
      - research/taxonomy-rebuild-validation-20261112
    paths:
      - '.github/workflows/research-pinned-archive-v2.yml'
      - 'research/taxonomy_v3/pin_research_archive_asset_v2.py'
permissions:
  contents: write
concurrency:
  group: research-pinned-archive-v2
  cancel-in-progress: false
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pyarrow>=18,<24'
      - name: Self-test archive integrity gate
        run: |
          python research/taxonomy_v3/pin_research_archive_asset_v2.py --self-test --output /tmp/research-market-v2.parquet --manifest /tmp/research-manifest-v2.json
      - name: Pin asset by ID and validate actual parquet
        run: |
          python research/taxonomy_v3/pin_research_archive_asset_v2.py --output /tmp/research-market-v2.parquet --manifest research/taxonomy_v3/output_v32/research_market_archive_v2_manifest.json
      - name: Publish manifest
        run: |
          cat research/taxonomy_v3/output_v32/research_market_archive_v2_manifest.json >> "$GITHUB_STEP_SUMMARY"
      - name: Commit provenance only to research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/taxonomy_v3/output_v32/research_market_archive_v2_manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: pin and verify replacement market archive provenance'
          git pull --rebase origin research/taxonomy-rebuild-validation-20261112
          git push origin HEAD:research/taxonomy-rebuild-validation-20261112
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-market-provenance-v2-${{ github.run_id }}
          path: research/taxonomy_v3/output_v32/research_market_archive_v2_manifest.json
          if-no-files-found: warn
