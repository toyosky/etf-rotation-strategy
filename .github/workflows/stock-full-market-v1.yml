name: Full A-share Value Reversal OLS V1
on:
  push:
    branches:
      - research/stock-value-pilot-20261028
    paths:
      - 'research/stock_value/full_market_v1/run.py'
      - '.github/workflows/stock-full-market-v1.yml'
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Backtest as-of date YYYY-MM-DD'
        required: false
        default: '2026-10-28'
      max_symbols:
        description: '0=full universe; positive integer=smoke test'
        required: false
        default: '0'
permissions:
  contents: write
concurrency:
  group: stock-full-market-v1-qfq-validated
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install numpy pandas pyarrow
      - name: Run full-market backtest
        run: |
          python research/stock_value/full_market_v1/run.py             --as-of "${{ inputs.as_of || '2026-10-28' }}"             --max-symbols "${{ inputs.max_symbols || '0' }}"
      - name: Upload full research bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-full-market-v1-${{ github.run_id }}
          path: |
            research/stock_value/full_market_v1/output/**
            research/stock_value/results/full-market-v1-latest.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
      - name: Commit compact summary only
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stock_value/results/full-market-v1-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh full A-share value reversal OLS v1 summary"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
