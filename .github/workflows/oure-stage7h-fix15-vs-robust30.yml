name: OURE Stage7H Fix15 vs Robust30

on:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage7h_fix15_vs_robust30_same_engine.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE7H_FIX15_VS_ROBUST30_SAME_ENGINE_DESIGN_20260915.md"
      - ".github/workflows/oure-stage7h-fix15-vs-robust30.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3 pyarrow
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage7h_fix15_vs_robust30_same_engine.py
      - name: Run Stage7H
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage7h_fix15_vs_robust30_same_engine.py \
            --output-dir oure-stage7h-output
      - name: Upload Stage7H artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage7h-fix15-vs-robust30-${{ github.run_id }}
          path: oure-stage7h-output/
          retention-days: 90
