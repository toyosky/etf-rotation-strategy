name: OURE Stage6K Prospective 2026H2 Lock

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/oure-stage6k-prospective-2026h2.yml"

permissions:
  contents: write
  actions: read

jobs:
  persist-original-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download original Stage6K artifact from first successful lock run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/stage6k-original
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/10356995074/zip \
            > /tmp/stage6k-original.zip
          unzip -q /tmp/stage6k-original.zip -d /tmp/stage6k-original
      - name: Verify original prediction commitment
        run: |
          echo "398b7c7eea1d0f42029706460e07aa2361d8f41c72e5c3df130c0759eb51732c  /tmp/stage6k-original/stage6k_2026H2_locked_predictions.csv" | sha256sum -c -
      - name: Persist immutable original snapshot
        run: |
          mkdir -p research/optimal_universe_reverse_engineering/locks
          gzip -9 -n -c /tmp/stage6k-original/stage6k_2026H2_locked_predictions.csv > research/optimal_universe_reverse_engineering/locks/stage6k_2026H2_locked_predictions.csv.gz
          cp /tmp/stage6k-original/oure_stage6k_prediction_lock.json research/optimal_universe_reverse_engineering/locks/oure_stage6k_2026H2_prediction_lock.json
          cp /tmp/stage6k-original/stage6k_2026H2_feature_sign_lock.csv research/optimal_universe_reverse_engineering/locks/stage6k_2026H2_feature_sign_lock.csv
          printf '%s\n' 'original_artifact_id=10356995074' 'original_run_id=34864518145' 'original_csv_sha256=398b7c7eea1d0f42029706460e07aa2361d8f41c72e5c3df130c0759eb51732c' > research/optimal_universe_reverse_engineering/locks/STAGE6K_2026H2_COMMITMENT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/optimal_universe_reverse_engineering/locks/
          if git diff --cached --quiet; then
            echo "original lock snapshot already persisted"
          else
            git commit -m "research: persist immutable Stage6K original prediction lock"
            git push
          fi
