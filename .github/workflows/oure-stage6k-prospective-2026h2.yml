name: OURE Stage6K Prospective 2026H2 Lock

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage6k_prospective_2026h2_directional_transfer.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE6K_PROSPECTIVE_2026H2_DIRECTIONAL_TRANSFER_DESIGN_20260914.md"
      - ".github/workflows/oure-stage6k-prospective-2026h2.yml"

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage6k_prospective_2026h2_directional_transfer.py
      - name: Lock Stage6K predictions
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage6k_prospective_2026h2_directional_transfer.py \
            --output-dir oure-stage6k-output
      - name: Upload Stage6K lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage6k-prospective-2026h2-${{ github.run_id }}
          path: oure-stage6k-output
          retention-days: 180
