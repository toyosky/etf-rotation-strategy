name: Archive Full-Market Daily Bars

on:
  push:
    paths:
      - 'automation/archive_full_market_daily.py'
      - '.github/workflows/archive-full-market-daily.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
      SUPABASE_STORAGE_S3_ENDPOINT: https://gsyziuzezmmnvgdoazkg.storage.supabase.co/storage/v1/s3
      SUPABASE_STORAGE_S3_REGION: ap-southeast-1
      SUPABASE_STORAGE_BUCKET: etf-research-archive
      SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
      SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas sqlalchemy psycopg2-binary pyarrow boto3
      - name: Compile archive script
        run: python -m py_compile automation/archive_full_market_daily.py
      - name: Archive and verify
        run: python automation/archive_full_market_daily.py
      - name: Publish summary
        if: always()
        run: |
          if [ -f full-market-daily-archive-summary.json ]; then
            echo '## Full-market daily archive' >> "$GITHUB_STEP_SUMMARY"
            cat full-market-daily-archive-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-market-daily-archive-${{ github.run_id }}
          path: full-market-daily-archive-summary.json
          if-no-files-found: warn
          retention-days: 30
