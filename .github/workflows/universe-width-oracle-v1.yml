name: Universe Width Oracle V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/universe/universe_width_oracle_v1.py'
      - 'research/universe/UNIVERSE_WIDTH_ORACLE_V1.md'
      - '.github/workflows/universe-width-oracle-v1.yml'

permissions:
  contents: read

concurrency:
  group: universe-width-oracle-v1
  cancel-in-progress: true

jobs:
  width-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt

      - run: python -m pip install --requirement research/requirements-full-market-ols.txt

      - name: Run universe width oracle diagnostic
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/universe/universe_width_oracle_v1.py \
            --greedy-path universe-width-greedy-v1.csv \
            --width-detail-path universe-width-random-detail-v1.csv \
            --width-summary-path universe-width-random-summary-v1.csv \
            --replacement-detail-path universe-width-replacement-detail-v1.csv \
            --replacement-summary-path universe-width-replacement-summary-v1.csv \
            --summary-path universe-width-oracle-v1-summary.json \
            --report-path universe-width-oracle-v1-report.md

      - name: Publish report
        if: always()
        run: |
          if [ -f universe-width-oracle-v1-report.md ]; then
            cat universe-width-oracle-v1-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe-width-oracle-v1-${{ github.run_id }}
          path: |
            universe-width-greedy-v1.csv
            universe-width-random-detail-v1.csv
            universe-width-random-summary-v1.csv
            universe-width-replacement-detail-v1.csv
            universe-width-replacement-summary-v1.csv
            universe-width-oracle-v1-summary.json
            universe-width-oracle-v1-report.md
          if-no-files-found: warn
          retention-days: 30
