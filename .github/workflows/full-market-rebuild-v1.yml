name: Full Market Rebuild Research V1
on:
  push:
    branches:
      - research/full-market-rebuild-v1
    paths:
      - '.github/workflows/full-market-rebuild-v1.yml'
      - 'research/full_market_rebuild/**'
  workflow_dispatch:
    inputs:
      min_symbols:
        description: "Minimum distinct symbols required (1 for small-pool smoke test; 100+ for full market)"
        required: true
        default: "1"
        type: string
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install numpy pandas sqlalchemy psycopg2-binary pyarrow
      - name: Extract independent rebuild episodes
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python -m research.full_market_rebuild.extract_events \
            --min-symbols "${{ inputs.min_symbols || '1' }}" \
            --out research/full_market_rebuild/output
      - name: Compare shock vs gradual rebuild episodes
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python -m research.full_market_rebuild.analyze_shock \
            --events research/full_market_rebuild/output/events.csv \
            --out research/full_market_rebuild/output
      - name: Upload research-only audit output
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-events-${{ github.run_id }}
          path: |
            research/full_market_rebuild/output/events.csv
            research/full_market_rebuild/output/manifest.json
            research/full_market_rebuild/output/events_labeled.csv
            research/full_market_rebuild/output/shock_report.json
            research/full_market_rebuild/output/by_symbol.csv
          retention-days: 14
