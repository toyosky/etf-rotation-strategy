name: Rebuild Raw OLS Episodes

on:
  push:
    paths:
      - 'research/rebuild_raw_ols_episodes.py'
      - '.github/workflows/rebuild-raw-ols-episodes.yml'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-full-market-ols.txt
      - run: python -m pip install --requirement research/requirements-full-market-ols.txt
      - name: Rebuild corrected compact episode table
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: |
          python research/rebuild_raw_ols_episodes.py \
            --summary-path raw-ols-episode-rebuild-summary.json
      - name: Show summary
        run: |
          cat raw-ols-episode-rebuild-summary.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat raw-ols-episode-rebuild-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: raw-ols-episode-rebuild-${{ github.run_id }}
          path: raw-ols-episode-rebuild-summary.json
          retention-days: 30
