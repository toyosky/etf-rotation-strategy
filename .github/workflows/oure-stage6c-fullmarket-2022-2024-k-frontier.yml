name: OURE Stage6C Full-Market 2022-24 K Frontier

on:
  workflow_dispatch:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage6c_fullmarket_2022_2024_k_frontier.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE6C_FULLMARKET_2022_2024_K_FRONTIER_DESIGN_20260914.md"
      - ".github/workflows/oure-stage6c-fullmarket-2022-2024-k-frontier.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements-full-market-ols.txt
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage6c_fullmarket_2022_2024_k_frontier.py
      - name: Run Stage6C
        env:
          PYTHONPATH: research
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
        run: >-
          python research/optimal_universe_reverse_engineering/oure_stage6c_fullmarket_2022_2024_k_frontier.py
          --output-dir oure-stage6c-output
      - name: Upload Stage6C artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage6c-fullmarket-k-frontier-${{ github.run_id }}
          path: oure-stage6c-output/
          retention-days: 90
