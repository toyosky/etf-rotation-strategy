name: OURE Stage8D Competition Novelty Add1

on:
  push:
    paths:
      - "research/optimal_universe_reverse_engineering/oure_stage8d_competition_novelty_add1.py"
      - "research/optimal_universe_reverse_engineering/OURE_STAGE8D_COMPETITION_NOVELTY_ADD1_DESIGN_20260915.md"
      - ".github/workflows/oure-stage8d-competition-novelty-add1.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas sqlalchemy psycopg2-binary scikit-learn boto3 pyarrow
      - name: Syntax check
        run: python -m py_compile research/optimal_universe_reverse_engineering/oure_stage8d_competition_novelty_add1.py
      - name: Run Stage8D
        env:
          ETF_DAILY_BARS_DATABASE_URL: ${{ secrets.ETF_DAILY_BARS_DATABASE_URL }}
          PYTHONPATH: research
        run: |
          python research/optimal_universe_reverse_engineering/oure_stage8d_competition_novelty_add1.py \
            --output-dir oure-stage8d-output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oure-stage8d-competition-novelty-add1-${{ github.run_id }}
          path: oure-stage8d-output/
          retention-days: 90
